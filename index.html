    const weekEnd = U.addDaysISO(today, 7);
    const week = jobs
      .filter((j) => isOpenStatus(jobStatus(j)) && j.date >= today && j.date <= weekEnd)
      .sort((a, b) => (a.date === b.date ? (a.id < b.id ? -1 : 1) : a.date < b.date ? -1 : 1));
    const weekCard = U.el('section', { class: 'card', 'aria-label': 'This week' },
      U.el('div', { class: 'ct' }, 'This week', U.el('span', { class: 'meta num', text: `${U.day(today)} – ${U.day(weekEnd)}` })),
      week.length
        ? U.el('div', { class: 'rows' }, week.map((j) => U.el('div', { class: 'row' },
            U.el('span', { class: 'rd num', text: U.day(j.date) }),
            U.el('a', { href: `#/customers/${j.customerId}`, text: name(j.customerId), onclick: (e) => { e.preventDefault(); go(`#/customers/${j.customerId}`); } }),
            U.el('span', { class: 'rmeta', text: vname(j.vehicleId) }),
            U.el('span', { class: 'sp' }),
            chip(jobStatus(j)),
          )))
        : U.el('div', { class: 'empty muted' },
            'No jobs scheduled this week. ',
            U.el('a', { href: '#/jobs/new', text: 'Add a job', onclick: (e) => { e.preventDefault(); go('#/jobs/new'); } })),
    );

    /* Recent jobs */
    const recentCard = U.el('section', { class: 'card', 'aria-label': 'Recent jobs' },
      U.el('div', { class: 'ct' }, 'Recent jobs',
        U.el('span', { class: 'sp' }),
        U.el('a', { href: '#/customers', text: 'All customers →', onclick: (e) => { e.preventDefault(); go('#/customers'); } })),
      dash.recentJobs.length
        ? U.el('div', { class: 'rows' }, dash.recentJobs.map((j) => U.el('div', { class: 'row' },
            U.el('span', { class: 'rd num', text: U.full(j.date) }),
            U.el('a', { href: `#/jobs/${j.id}`, text: `${name(j.customerId)} — ${j.description}`, onclick: (e) => { e.preventDefault(); go(`#/jobs/${j.id}`); } }),
            U.el('span', { class: 'sp' }),
            U.el('span', { class: 'rd num', text: U.money(j.total) }),
            chip(jobStatus(j)),
          )))
        : U.el('div', { class: 'empty muted' }, 'No jobs yet.'),
    );

    body.append(attCard, weekCard, recentCard);
  });
});

const LIST_SORT_KEY = 'llt_crm_listsort';
const PAGE_SIZE = 25;

function listSort() {
  try {
    const s = JSON.parse(sessionStorage.getItem(LIST_SORT_KEY) || 'null');
    if (s && ['name', 'last', 'next'].includes(s.key) && ['asc', 'desc'].includes(s.dir)) return s;
  } catch { /* fall through */ }
  return { key: 'name', dir: 'asc' };
}

registerScreen('customers', (view) => {
  const state = { q: '', sort: listSort(), page: 1 };
  window.__crmFormPreserve = null;

  const bar = U.el('div', { class: 'bar' },
    U.el('h1', { text: 'Customers' }),
    U.el('span', { class: 'meta num', id: 'custCount', 'aria-live': 'polite', text: '' }),
    U.el('span', { class: 'sp' }),
    U.el('button', { class: 'btn secondary', type: 'button', 'aria-label': 'Backup customers to a JSON file', onclick: () => backupCustomers() }, 'Backup customers'),
    U.el('a', { class: 'btn primary', href: '#/customers/new', onclick: (e) => { e.preventDefault(); go('#/customers/new'); } }, 'Add customer'),
  );

  const search = U.el('div', { class: 'search' },
    U.el('span', { class: 'sicon', 'aria-hidden': true }, U.svgIcon('search')),
    U.el('input', {
      class: 'inp', type: 'search', role: 'searchbox',
      placeholder: 'Search name, phone, email, VIN, plate…',
      'aria-label': 'Search customers',
    }),
    U.el('button', { class: 'clear', type: 'button', 'aria-label': 'Clear search', text: '×', style: 'display:none;' }),
  );
  const qInput = search.querySelector('input');
  const qClear = search.querySelector('.clear');

  const tableWrap = U.el('div', { class: 'tbl-wrap' });
  const cardStack = U.el('div', { class: 'cstack' });
  const pager = U.el('div', { class: 'pager' });

  view.append(bar, search, U.el('div', { id: 'cbody' }), tableWrap, cardStack, pager);

  let cache = null; // {rows: enriched customers}

  function enrich(rows) {
    return rows.map((c) => {
      const vs = (cache.vehByCust[c.id] || []);
      const js = (cache.jobsByCust[c.id] || []); // date_desc
      const last = js[0] || null;
      const next = js.find((j) => isOpenStatus(jobStatus(j)) && j.date >= U.todayISO()) || null;
      return { c, vs, last, next };
    });
  }

  function draw() {
    if (!cache) return;
    let rows = enrich(cache.customers);

    if (state.q) {
      const q = state.q.toLowerCase();
      rows = rows.filter(({ c, vs }) =>
        c.name.toLowerCase().includes(q) ||
        c.phone.toLowerCase().includes(q) ||
        c.email.toLowerCase().includes(q) ||
        vs.some((v) => v.vin.toLowerCase().includes(q) || v.plate.toLowerCase().includes(q)));
    }

    const { key, dir } = state.sort;
    const mul = dir === 'asc' ? 1 : -1;
    const val = (r) => key === 'name' ? r.c.name : key === 'last' ? (r.last ? r.last.date : '') : (r.next ? r.next.date : '');
    rows.sort((a, b) => {
      if (key === 'name') return a.c.name.localeCompare(b.c.name, undefined, { sensitivity: 'base' }) * mul || (a.c.id < b.c.id ? -1 : 1);
      const av = val(a), bv = val(b);
      if (av === bv) return a.c.id < b.c.id ? -1 : 1;
      return av < bv ? -mul : mul; // empty (no date) always last regardless of dir
    });

    const total = rows.length;
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (state.page > pages) state.page = pages;
    const start = (state.page - 1) * PAGE_SIZE;
    const pageRows = rows.slice(start, start + PAGE_SIZE);

    view.querySelector('#custCount').textContent =
      `${total} customer${total === 1 ? '' : 's'}${state.q ? ` · ${total} match${total === 1 ? '' : 'es'}` : ''}`;
    qClear.style.display = state.q ? '' : 'none';

    renderTable(pageRows, rows.length === 0 && !state.q);
    renderCards(pageRows);

    pager.innerHTML = '';
    if (total > 0) {
      pager.append(
        U.el('span', { class: 'num', text: `Showing ${start + 1}–${Math.min(start + PAGE_SIZE, total)} of ${total} · Page ${state.page} of ${pages}` }),
        U.el('span', { class: 'sp' }),
        U.el('button', { class: 'btn secondary sm', type: 'button', text: '‹ Prev', disabled: state.page <= 1, onclick: () => { state.page--; draw(); } }),
        U.el('button', { class: 'btn secondary sm', type: 'button', text: 'Next ›', disabled: state.page >= pages, onclick: () => { state.page++; draw(); } }),
      );
    } else pager.style.display = 'none';
  }

  function sortTh(key, labelText) {
    const { key: sk, dir } = state.sort;
    const th = U.el('th', { scope: 'col' });
    const btn = U.el('button', {
      class: 'sortbtn', type: 'button',
      'aria-label': `Sort by ${labelText}`,
      onclick: () => {
        state.sort = sk === key ? { key, dir: dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' };
        try { sessionStorage.setItem(LIST_SORT_KEY, JSON.stringify(state.sort)); } catch { /* private mode */ }
        draw();
      },
    }, labelText, U.el('span', { class: 'arr num', text: sk === key ? (dir === 'asc' ? '▲' : '▼') : '' }));
    th.append(btn);
    if (sk === key) th.setAttribute('aria-sort', dir === 'asc' ? 'ascending' : 'descending');
    return th;
  }

  function renderTable(pageRows, isTrueEmpty) {
    tableWrap.innerHTML = '';
    if (isTrueEmpty) {
      tableWrap.style.display = '';
      tableWrap.append(U.el('div', { class: 'card' }, emptyState({
        title: 'No customers yet',
        body: 'Add your first customer to start tracking service history.',
        cta: [{ label: 'Add customer', href: '#/customers/new' }],
      })));
      return;
    }
    tableWrap.style.display = '';
    const noResults = pageRows.length === 0 && state.q;
    const tbl = U.el('table', { class: 'tbl' },
      U.el('caption', { class: 'sr-only', text: 'Customers, sortable by name, last service, and next scheduled service' }),
      U.el('thead', null, U.el('tr', null,
        sortTh('name', 'Customer'),
        U.el('th', { scope: 'col', text: 'Vehicles' }),
        sortTh('last', 'Last service'),
        sortTh('next', 'Next up'),
        U.el('th', { scope: 'col', 'aria-label': 'Actions', class: 'sr-only' })),
      ),
      U.el('tbody', null, pageRows.map((r) => {
        const tr = U.el('tr', { class: 'rowlink', 'data-id': r.c.id, tabindex: '0' });
        const cells = [];
        cells.push(U.el('td', null,
          U.el('a', { href: `#/customers/${r.c.id}`, text: r.c.name, onclick: (e) => { e.preventDefault(); go(`#/customers/${r.c.id}`); }, style: 'font-weight:500;' }),
          U.el('div', { class: 'sub num', text: r.c.phone })));
        cells.push(U.el('td', null, r.vs.length
          ? (r.vs.length === 1 ? U.vehicleName(r.vs[0]) : r.vs.length <= 4 ? r.vs.map((v) => U.vehicleName(v)).join(', ') : `${r.vs.length} vehicles`)
          : U.el('span', { class: 'dash', text: '—' })));
        cells.push(U.el('td', null, r.last
          ? U.el(null, null,
              U.el('span', { class: 'num', text: U.full(r.last.date) }),
              U.el('div', { class: 'sub', text: r.last.description }))
          : U.el('span', { class: 'dash', text: '—' })));
        cells.push(U.el('td', null, r.next
          ? U.el('span', { class: 'num', text: U.full(r.next.date) })
          : U.el('span', { class: 'dash', text: '—' })));
        tr.append(...cells);
        tr.addEventListener('click', (e) => { if (!e.target.closest('a,button')) go(`#/customers/${r.c.id}`); });
        return tr;
      })),
    );
    if (noResults) {
      tableWrap.innerHTML = '';
      const box = U.el('div', { class: 'card' },
        U.el('div', { class: 'empty' },
          U.el('div', { class: 'et' }, `No matches for “${state.q}”.`),
          U.el('div', { class: 'row', style: 'border-top:none;' },
            U.el('button', { class: 'btn secondary', type: 'button', onclick: () => { qInput.value = ''; state.q = ''; state.page = 1; draw(); qInput.focus(); } }, 'Clear search'),
            U.el('a', { class: 'btn secondary', href: '#/customers/new', onclick: (e) => { e.preventDefault(); go('#/customers/new'); } }, 'Add customer'),
          ),
        ),
      );
      tableWrap.append(box);
    } else {
      tableWrap.append(tbl);
      rovingRows(tableWrap, (id) => go(`#/customers/${id}`));
    }
  }

  function renderCards(pageRows) {
    cardStack.innerHTML = '';
    cardStack.append(...pageRows.map((r) => {
      const card = U.el('a', { class: 'mcard', href: `#/customers/${r.c.id}`, onclick: (e) => { e.preventDefault(); go(`#/customers/${r.c.id}`); } });
      card.append(
        U.el('div', { class: 't' }, r.c.name, U.el('span', { class: 'chev', 'aria-hidden': true, text: '›' })),
        U.el('div', { class: 's num', text: r.c.phone }),
        U.el('div', { class: 's' },
          `${r.vs.length} vehicle${r.vs.length === 1 ? '' : 's'}${r.last ? ` · Last: ${U.full(r.last.date)} · ${U.money(r.last.total)}` : ''}${r.next ? ` · Next: ${U.full(r.next.date)}` : ''}`),
      );
      return card;
    }));
  }

  qInput.addEventListener('input', U.debounce(() => {
    state.q = qInput.value.trim();
    state.page = 1;
    draw();
  }, 150));
  qClear.addEventListener('click', () => {
    qInput.value = '';
    state.q = '';
    state.page = 1;
    draw();
    qInput.focus();
  });

  tableWrap.style.display = 'none';
  withLoad(view.querySelector('#cbody'), async () => {
    view.querySelector('#cbody').innerHTML = '';
    cache = await listData();
    cache.customers = await api.getCustomers(); // name-sorted base
    draw();
  });
});

registerScreen('customerDetail', (view, { id }) => {
  const body = U.el('div', null);
  view.append(body);

  withLoad(body, async () => {
    body.innerHTML = '';
    let c;
    try { c = await api.getCustomer(id); } catch (e) { if (e instanceof ApiError && e.code === 'not_found') return body.append(notFoundScreen(e.message)); throw e; }
    const [vehicles, jobs] = await Promise.all([
      api.getVehicles({ customerId: id }),
      api.getJobs({ customerId: id, dir: 'date_desc' }),
    ]);
    const jobsByVeh = {};
    jobs.forEach((j) => (jobsByVeh[j.vehicleId] = jobsByVeh[j.vehicleId] || []).unshift(j));

    /* header */

        e.stopPropagation();
        const open = menu.classList.toggle('open');
        if (open) {
          menu.innerHTML = '';
          menu.append(
            menuItem('Add vehicle', `#/customers/${id}/vehicles/new`),
            menuItem('New service job', `#/jobs/new?customer=${id}`),
            U.el('div', { class: 'sep', style: 'border-top:1px solid var(--border); margin:4px 0;' }),
            U.el('a', { class: 'mi', role: 'menuitem', style: 'color:var(--danger);', href: '#', onclick: (e) => { e.preventDefault(); close(); askDeleteCustomer(); } }, 'Delete customer'),
          );
          menu.querySelector('.mi').focus();
        }
      } }),
      menu,
    );
    function close() { menu.classList.remove('open'); }
    document.addEventListener('click', function h(e) { if (!menuWrap.contains(e.target)) { close(); document.removeEventListener('click', h); } });

    body.append(
      U.el('div', { class: 'crumbs' }, U.el('a', { href: '#/customers', onclick: (e) => { e.preventDefault(); go('#/customers'); } }, 'Customers'),
        U.el('span', { class: 'sep', 'aria-hidden': true, text: '/' }),
        c.name),
      U.el('div', { class: 'bar' },
        U.el('h1', { text: c.name }),
        U.el('span', { class: 'sp' }),
        U.el('a', { class: 'btn secondary', href: `#/customers/${id}/edit`, onclick: (e) => { e.preventDefault(); go(`#/customers/${id}/edit`); } }, 'Edit'),
        menuWrap,
      ),
      U.el('div', { class: 'meta', style: 'font-size:13px; margin-bottom:18px;', text: [c.phone, c.email || '—', c.address || ''].filter(Boolean).join(' · ') }),
    );

    /* vehicles */
    const vhead = U.el('div', { class: 'ct', style: 'font-size:15px; font-weight:600; margin:22px 0 10px; display:flex; align-items:center; gap:10px;' },
      `Vehicles (${vehicles.length})`, U.el('span', { class: 'sp' }),
      U.el('a', { class: 'btn secondary sm', href: `#/customers/${id}/vehicles/new`, onclick: (e) => { e.preventDefault(); go(`#/customers/${id}/vehicles/new`); } }, 'Add vehicle'));
    body.append(vhead);

    const vgrid = U.el('div', { class: 'vgrid' });
    if (!vehicles.length) {
      body.append(U.el('div', { class: 'card' },
        U.el('div', { class: 'empty' },
          U.el('div', { class: 'et', text: 'No vehicles yet' }),
          U.el('div', { class: 'row', style: 'border-top:none;' },
            U.el('a', { class: 'btn primary', href: `#/customers/${id}/vehicles/new`, onclick: (e) => { e.preventDefault(); go(`#/customers/${id}/vehicles/new`); } }, 'Add vehicle')))));
    } else {
      const shown = vehicles.slice(0, 4);
      const rest = vehicles.slice(4);
      shown.forEach((v) => vgrid.append(vehicleCard(v, (jobsByVeh[v.id] || [])[0] || null)));
      if (rest.length) {
        const holder = U.el('div', { class: 'vrest' });
        const moreBtn = U.el('button', { class: 'btn secondary sm', type: 'button', text: `Show all ${vehicles.length}`, onclick: () => {
          holder.append(...rest.map((v) => vehicleCard(v, (jobsByVeh[v.id] || [])[0] || null)));
          holder.remove();
          moreBtn.remove();
        } });
        body.append(moreBtn, holder);
      }
      body.append(vgrid);
    }

    /* service history */
    const histBody = U.el('div', null);
    const filterSel = U.el('select', { class: 'inp', style: 'width:auto; min-width:170px; height:34px; font-size:13.5px;', 'aria-label': 'Filter history by vehicle' },
      U.el('option', { value: '', text: 'All vehicles' }),
      ...vehicles.map((v) => U.el('option', { value: v.id, text: U.vehicleName(v) })));
    const hhead = U.el('div', { class: 'ct', style: 'font-size:15px; font-weight:600; margin:22px 0 10px; display:flex; align-items:center; gap:10px;' },
      `Service history (${jobs.length})`, U.el('span', { class: 'sp' }), filterSel);
    body.append(hhead, histBody);

    function drawHistory() {
      histBody.innerHTML = '';
      const fv = filterSel.value;
      const list = fv ? jobs.filter((j) => j.vehicleId === fv) : jobs;
      if (!list.length) {
        histBody.append(U.el('div', { class: 'card' },
          U.el('div', { class: 'empty' },
            U.el('div', { class: 'et', text: 'No service yet' }),
            U.el('div', { class: 'row', style: 'border-top:none;' },
              U.el('a', { class: 'btn primary', href: `#/jobs/new?customer=${id}`, onclick: (e) => { e.preventDefault(); go(`#/jobs/new?customer=${id}`); } }, 'New service job')))));
        return;
      }
      const vehById = {};
      vehicles.forEach((v) => vehById[v.id] = v);
      const tl = U.el('div', { class: 'tl' });
      let year = null;
      list.forEach((j) => {
        const y = (j.date || '').slice(0, 4);
        if (y !== year) {
          year = y;
          tl.append(U.el('div', { class: 'yhead', text: y }));
        }
        tl.append(timelineEntry(j, { showVehicle: !fv, vehName: vehById[j.vehicleId] ? U.vehicleName(vehById[j.vehicleId]) : j.vehicleId }));
      });
      histBody.append(tl);
    }
    filterSel.addEventListener('change', drawHistory);
    drawHistory();

    /* notes */
    if (c.notes) {
      body.append(U.el('section', { class: 'card', 'aria-label': 'Notes' },
        U.el('div', { class: 'ct' }, 'Notes', U.el('span', { class: 'sp' }),
          U.el('a', { href: `#/customers/${id}/edit`, onclick: (e) => { e.preventDefault(); go(`#/customers/${id}/edit`); } }, 'Edit')),
        U.el('p', { style: 'font-size:14px; color:var(--ink-soft);', text: c.notes })));
    }

    /* delete customer */
    async function askDeleteCustomer() {
      const vCount = vehicles.length, jCount = jobs.length;
      if (jCount) {
        confirmDialog({
          title: 'Delete customer',
          body: U.el('span', null,
            `${c.name} has ${jCount} service job${jCount === 1 ? '' : 's'}${vCount ? ` and ${vCount} vehicle${vCount === 1 ? '' : 's'}` : ''}. `),
          confirmLabel: 'OK', danger: false,
          onConfirm: null,
        });
        // spec: blocked while jobs exist — the dialog explains, no confirm
        return;
      }
      confirmDialog({
        title: 'Delete customer',
        body: U.el('span', null,
          `Delete ${c.name}?${vCount ? ` This also deletes ${vCount} vehicle${vCount === 1 ? '' : 's'}.` : ''} This cannot be undone.`),
        confirmLabel: 'Delete customer', danger: true,
        onConfirm: async () => {
          try {
            // remove vehicles first (customer delete is blocked while any remain)
            for (const v of vehicles) await api.deleteVehicle(v.id);
            await api.deleteCustomer(id);
            toast('Customer deleted');
            go('#/customers');
          } catch (e) {
            toast(e instanceof ApiError ? e.message : 'Could not delete customer.', 'error');
          }
        },
      });
    }
  });

  function vehicleCard(v, lastJob) {
    const card = U.el('a', { class: 'vcard', href: `#/vehicles/${v.id}`, onclick: (e) => { e.preventDefault(); go(`#/vehicles/${v.id}`); }, 'aria-label': `Edit ${U.vehicleName(v)}` });
    card.append(
      U.el('div', { class: 'vn', text: U.vehicleName(v) }),
      U.el('div', { class: 'vm' },
        v.plate ? U.el('span', { class: 'plate', text: v.plate }) : null,
        U.el('span', { class: 'num', text: `${U.int(v.mileage)} mi` })),
      lastJob
        ? U.el('div', { class: 'vm' }, U.el('span', { class: 'meta num', text: `Last: ${lastJob.description} — ${U.full(lastJob.date)} · ${U.money(lastJob.total)}` }))
        : null,
    );
    return card;
  }

  function timelineEntry(j, { showVehicle, vehName }) {
    const ex = Overlay.jobEx(j.id);
    const exp = U.el('div', { class: 'tlx' },
      U.el('div', null,
        U.el('div', { class: 'detail' },
          U.el('div', { class: 'kv' },
            showVehicle ? U.el(null, null, U.el('span', { class: 'k', text: 'Vehicle' }), U.el('span', { class: 'v', text: vehName })) : null,
            U.el(null, null, U.el('span', { class: 'k', text: label('technician') }), U.el('span', { class: 'v', text: j.technician || '—' })),
            U.el(null, null, U.el('span', { class: 'k', text: label('labor') }), U.el('span', { class: 'v num', text: U.money(j.labor) })),
            U.el(null, null, U.el('span', { class: 'k', text: label('parts') }), U.el('span', { class: 'v num', text: U.money(j.parts) })),
            U.el(null, null, U.el('span', { class: 'k', text: label('total') }), U.el('span', { class: 'v num', text: U.money(j.total) })),
            ex && ex.mileage != null ? U.el(null, null, U.el('span', { class: 'k', text: label('mileage') }), U.el('span', { class: 'v num', text: `${U.int(ex.mileage)} mi` })) : null,
          ),
          j.notes ? U.el('div', { class: 'notes', text: j.notes }) : null,
          U.el('div', { style: 'margin-top:10px; text-align:right;' },
            U.el('a', { class: 'btn ghost sm', href: `#/jobs/${j.id}`, onclick: (e) => { e.preventDefault(); go(`#/jobs/${j.id}`); } }, 'Open job')),
        ),
      ),
    );
    const row = U.el('div', { class: 'te', role: 'button', tabindex: '0', 'aria-expanded': 'false' });
    row.append(
      U.el('span', { class: 'd num', text: U.full(j.date) }),
      U.el('div', { style: 'min-width:0;' },
        U.el('div', { class: 'sum' }, j.description, ' ', chip(jobStatus(j))),

      U.el('span', { class: 'tot num', text: U.money(j.total) }),
      U.el('span', { class: 'exp num', text: 'Open · +' }),

    );

      const open = row.classList.toggle('open');
      row.setAttribute('aria-expanded', String(open));
      row.querySelector('.exp').textContent = open ? 'Close · –' : 'Open · +';
    };

    row.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    return row;
  }

  function menuItem(text, hash) {
    return U.el('a', { class: 'mi', role: 'menuitem', href: hash, onclick: (e) => { e.preventDefault(); go(hash); } }, text);

    const descF = kit.makeField({ name: 'description', lbl: 'Description', required: true, type: 'text',
      attrs: { value: job ? job.description : '' }, extra: descC.node,

    descTa.addEventListener('blur', () => { if (descF.touched !== true) { descF.touched = true; descF.validate(descF.value()); } });
    descC.bind(descTa);
    kit.form.append(descF.input.closest('.field'));

    const jmF = kit.makeField({ name: 'mileage', lbl: 'Mileage', type: 'number', inputmode: 'numeric',
      attrs: { value: ex && ex.mileage != null ? String(ex.mileage) : '', min: '0', max: '999999' },
      hint: 'Odometer at this visit. Leave blank to keep the last reading.',
      validate: (v) => {
        if (v === '') return null;
        const n = parseNumStr(v);
        if (n === null || !Number.isInteger(n) || n < 0 || n > 999999) return 'Mileage must be 0–999,999.';

    kit.form.append(jmF.input.closest('.field'));

    /* Charges section */
    kit.form.append(U.el('div', { class: 'sec-t', text: 'Charges' }));
    const grid3 = U.el('div', { class: 'fieldgrid' });
    const laborF = kit.makeField({ name: 'labor', lbl: 'Labor', type: 'text', inputmode: 'decimal',
      attrs: { value: job ? String(job.labor) : '' },
      validate: (v) => {
        const n = parseMoney(v);
        if (v === '') return null;
        if (n === null || !Number.isFinite(n) || n < 0 || n > 999999.99) return 'Labor must be $0–$999,999.99.';
        return null;
      } });
    // validate AFTER sanitizing: the clamp is part of the blur behavior,
    // so the painted error must reflect the value the user is left with
    // (e.g. "-50" -> "" -> optional, valid, no stale error).
    laborF.input.addEventListener('blur', () => { sanitizeMoneyInput(laborF.input); laborF.validate(laborF.value()); });
    const partsF = kit.makeField({ name: 'parts', lbl: 'Parts', type: 'text', inputmode: 'decimal',

        if (v === '') return null;
        if (n === null || !Number.isFinite(n) || n < 0 || n > 999999.99) return 'Parts must be $0–$999,999.99.';

    grid3.append(laborF.input.closest('.field'), partsF.input.closest('.field'));
    kit.form.append(grid3);

    /* Total: read-only — the backend always recomputes round(labor+parts, 2),

      totalInp.value = U.money(Math.round((l + p) * 100) / 100);

    laborF.input.addEventListener('input', recalc);
    partsF.input.addEventListener('input', recalc);
    recalc();

    /* Details */
    kit.form.append(U.el('div', { class: 'sec-t', text: 'Details' }));
    const notesC = counterEl({ showAt: 1600, max: 2000 });
    const notesF = kit.makeField({ name: 'notes', lbl: 'Notes', type: 'text', attrs: { value: job ? job.notes : '' }, extra: notesC.node,
      validate: (v) => (String(v).length > 2000 ? 'Notes are too long (max 2,000 characters).' : null) });
    const notesTa = U.el('textarea', { class: 'inp', rows: 3, maxlength: 2000, id: notesF.input.id });

    kit.snapshotNow();
    setDirty(false);
    kit.root.addEventListener('input', () => { setDirty(kit.isDirty()); saveDraft(); });
    vehSelEl.addEventListener('change', saveDraft);
    custSel.input.addEventListener('change', saveDraft);

    function saveDraft() {
      if (!kit.isDirty()) { delete JOB_DRAFTS[draftKey]; return; }
      JOB_DRAFTS[draftKey] = {};
      kit.fields.forEach((f) => { try { JOB_DRAFTS[draftKey][f.name] = f.value(); } catch { /* detached */ } });
    }

    // restore an in-flight draft (e.g. left to add a vehicle, came back)
    const draft = JOB_DRAFTS[draftKey];
    if (draft) {
      for (const [k, val] of Object.entries(draft)) {
        const f = kit.fields.get(k);
        if (f && f.input && typeof val === 'string' && f.input.value !== val) {
          f.input.value = val;
        }
      }
      delete JOB_DRAFTS[draftKey];
      kit.snapshotNow();
      setDirty(false);
      recalc();

            await api.deleteJob(id);
            toast('Job deleted');
            go(`#/customers/${job.customerId}`);

            toast(e instanceof ApiError ? e.message : 'Could not delete job.', 'error');
          }

});

/* ----------------------------- W7 settings ------------------------- */

const LABEL_GROUPS = [
  ['Customer', ['name', 'phone', 'email', 'address', 'notes']],
  ['Vehicle', ['make', 'model', 'year', 'vin', 'plate', 'mileage']],
  ['Job', ['date', 'status', 'description', 'labor', 'parts', 'total', 'technician']],
];

registerScreen('settings', (view) => {
  // one savebar per settings mount
  document.querySelectorAll('body > .savbar').forEach((b) => b.remove());
  const base = U.el('div', { class: 'bar' },
    U.el('h1', { text: 'Settings' }),
    U.el('span', { class: 'meta', text: 'Labels, service types, statuses — one save applies the whole page' }),
    U.el('span', { class: 'sp' }),
    U.el('button', { class: 'btn secondary', type: 'button', text: 'Reset all to defaults' }),
  );
  const holder = U.el('div', { class: 'form-col settings' });
  view.append(base, holder);

  const resetBtn = base.querySelector('button');

  withLoad(holder, async () => {
    holder.innerHTML = '';
    await apiReady(); // ensures cfgCache + overlay are loaded
    const cfg = config();
    const baseLabels = cfg && cfg.fieldLabels ? cfg.fieldLabels : {};

    // draft state
    const draft = {
      labels: { ...Overlay.data.labels },
      types: [...serviceTypes()],
      customs: [...Overlay.data.customs],
    };
    // mark which service types are "default" (came from the backend config, not typed by the user)
    const baseTypes = baseServiceTypes();
    const userTypedTypes = Overlay.data.types ? new Set(Overlay.data.types) : new Set();

    // dirty is measured against the LAST-PERSISTED state (the overlay at
    // mount), not the factory defaults — a saved override legitimately
    // differs from the defaults and must NOT read as unsaved, otherwise
    // the leave-dialog trap would block all navigation from Settings.
    const snapshot = {
      labels: {},
      types: [...draft.types],
      customs: [...draft.customs],
    };
    Object.keys(baseLabels).forEach((k) => {
      const base = baseLabels[k] || '';
      snapshot.labels[k] = (Overlay.data.labels && k in Overlay.data.labels) ? Overlay.data.labels[k] : base;
    });

    function isDirty() {
      const lblDirty = Object.keys(baseLabels).some((k) =>
        (draft.labels[k] !== undefined ? draft.labels[k] : (baseLabels[k] || '')) !== snapshot.labels[k]);
      const typesDirty = JSON.stringify(draft.types) !== JSON.stringify(snapshot.types);
      const customDirty = JSON.stringify(draft.customs) !== JSON.stringify(snapshot.customs);
      return lblDirty || typesDirty || customDirty;
    }
    function changeCount() {
      let n = 0;
      Object.keys(baseLabels).forEach((k) => {
        if ((draft.labels[k] !== undefined ? draft.labels[k] : (baseLabels[k] || '')) !== snapshot.labels[k]) n++;
      });
      if (JSON.stringify(draft.types) !== JSON.stringify(snapshot.types)) n += 1;
      if (JSON.stringify(draft.customs) !== JSON.stringify(snapshot.customs)) n += 1;
      return n;
    }

    /* ---------- labels ---------- */
    const labelsCard = U.el('section', { class: 'card', 'aria-label': 'Field labels' },
      U.el('div', { class: 'ct' }, 'Field labels',
        U.el('span', { class: 'meta', text: 'display-only — a label change never changes the data' })),
      U.el('p', { class: 'setnote', text: 'Labels update forms, tables, and detail pages immediately after saving.' }));

    const labelRows = {}; // key -> {inp, errEl, group}
    function labelRow(group, key) {
      const def = baseLabels[key] || key;
      const errEl = U.el('div', { class: 'errmsg', role: 'alert', style: 'display:none;' });
      const inp = U.el('input', { class: 'inp', type: 'text', maxlength: 40, 'aria-label': `${def} label` });
      inp.value = draft.labels[key] !== undefined ? draft.labels[key] : def;
      const modPill = U.el('span', { class: 'modpill', text: 'modified', style: 'display:none;' });
      const defHint = U.el('div', { class: 'hint', text: `default: ${def}`, style: 'display:none;' });
      const cell = U.el('div', { class: 'inpcell' },
        U.el('div', { style: 'display:flex; align-items:center; gap:4px; min-width:0;' }, inp, modPill),
        defHint, errEl);
      const row = U.el('div', { class: 'setrow' },
        U.el('span', { class: 'sk2', text: `${group} · ${def}` }),
        cell,
        U.el('button', {
          class: 'btn ghost sm', type: 'button', text: 'Reset', disabled: true, 'aria-label': `Reset ${def} to default`,
          onclick: () => {
            inp.value = def;
            delete draft.labels[key];
            touch();
          },
        }));
      labelRows[key] = { inp, errEl, modPill, defHint, group, def };
      inp.addEventListener('input', () => {
        draft.labels[key] = inp.value.trim();
        errEl.style.display = 'none';
        touch();
      });
      labelsCard.append(row);
    }
    // group the keys that exist in config, preserving config order
    const known = new Set(LABEL_GROUPS.flatMap(([, keys]) => keys));
    const order = [];
    LABEL_GROUPS.forEach(([, keys]) => keys.forEach((k) => { if (k in baseLabels && !order.includes(k)) order.push(k); }));
    Object.keys(baseLabels).forEach((k) => { if (!known.has(k) && !order.includes(k)) order.push(k); });
    LABEL_GROUPS.forEach(([g, keys]) => {
      const any = keys.filter((k) => k in baseLabels);
      if (!any.length) return;
      labelsCard.append(U.el('div', { class: 'grouph', text: g }));
      any.forEach((k) => labelRow(g, k));
    });
    const extra = order.filter((k) => !known.has(k));
    if (extra.length) {
      labelsCard.append(U.el('div', { class: 'grouph', text: 'Other' }));
      extra.forEach((k) => labelRow('Other', k));
    }

    /* ---------- service types ---------- */
    const typesCard = U.el('section', { class: 'card', 'aria-label': 'Service types' },
      U.el('div', { class: 'ct' }, 'Service types', U.el('span', { class: 'sp' })));
    const addTypeBtn = U.el('button', { class: 'btn ghost sm', type: 'button', text: 'Add service type' });
    typesCard.querySelector('.ct').append(addTypeBtn);
    const typesHolder = U.el('div', null);
    const typeUseCount = (t) => Object.values(Overlay.data.jobs).filter((j) => j.serviceType === t).length;

    function drawTypes() {
      typesHolder.innerHTML = '';
      draft.types.forEach((t, i) => {
        const errEl = U.el('div', { class: 'errmsg', role: 'alert', style: 'display:none;' });
        const inp = U.el('input', { class: 'inp', type: 'text', maxlength: 40, 'aria-label': `Service type ${i + 1}` });
        inp.value = t;
        const used = typeUseCount(t);
        const del = U.el('button', {
          class: 'btn ghost sm', type: 'button',
          text: used ? `In use by ${used} job${used === 1 ? '' : 's'}` : 'Delete',
          disabled: used > 0,
          'aria-label': used ? `Service type in use by ${used} jobs, cannot delete` : `Delete ${t}`,
          onclick: () => { draft.types.splice(i, 1); touch(); drawTypes(); },
        });
        const isNew = !userTypedTypes.has(t) && !baseTypes.includes(t);
        const row = U.el('div', { class: 'row', style: 'border-top:1px solid var(--border);' },
          U.el('div', { style: 'flex:1; min-width:0; position:relative;' }, inp, isNew ? U.el('span', { class: 'modpill', text: 'new' }) : null, errEl),
          del);
        inp.addEventListener('input', () => {
          draft.types[i] = inp.value.trim();
          errEl.style.display = 'none';
          touch();
        });
        typesHolder.append(row);
      });
      if (!draft.types.length) typesHolder.append(U.el('div', { class: 'empty muted' }, 'No service types — add one.'));
    }
    addTypeBtn.addEventListener('click', () => {
      draft.types.push('');
      touch();
      drawTypes();
      const inps = typesHolder.querySelectorAll('input');
      inps[inps.length - 1].focus();
    });
    typesCard.append(typesHolder);

    /* ---------- statuses ---------- */
    const statCard = U.el('section', { class: 'card', 'aria-label': 'Statuses' },
      U.el('div', { class: 'ct' }, 'Statuses', U.el('span', { class: 'sp' })));
    const statusesHolder = U.el('div', null);
    coarseStatuses().forEach((s) => {
      statusesHolder.append(U.el('div', { class: 'row', style: 'border-top:1px solid var(--border);' },
        chip(s),
        U.el('span', { class: 'rmeta', style: 'margin-left:8px;', text: 'locked' })));
    });
    statusesHolder.append(U.el('div', { class: 'grouph', style: 'margin-top:8px;', text: 'Custom statuses' }));
    const customsHolder = U.el('div', null);
    const addStatusBtn = U.el('button', { class: 'btn ghost sm', type: 'button', text: 'Add custom status' });
    statCard.querySelector('.ct').append(addStatusBtn);

    const statusUseCount = (s) => Object.values(Overlay.data.jobs).filter((j) => j && j.status === s).length;
    function drawCustoms() {
      customsHolder.innerHTML = '';
      draft.customs.forEach((s, i) => {
        const errEl = U.el('div', { class: 'errmsg', role: 'alert', style: 'display:none;' });
        const inp = U.el('input', { class: 'inp', type: 'text', maxlength: 40, 'aria-label': `Custom status ${i + 1}` });
        inp.value = s;
        const used = statusUseCount(s);
        const del = U.el('button', {
          class: 'btn ghost sm', type: 'button',
          text: used ? `In use by ${used} job${used === 1 ? '' : 's'}` : 'Delete',
          disabled: used > 0,
          onclick: () => { draft.customs.splice(i, 1); touch(); drawCustoms(); },
        });
        // live color preview: the swatch this custom would get (by its position)
        const preview = U.el('span', { class: 'chip num' }, U.el('span', { class: 'dot', 'aria-hidden': true }), s || '…');
        // compute the prospective swatch for the current draft position
        const usedHex = new Set(coarseStatuses().map((x) => (STATUS_LIGHT[x] || ['#6B6357'])[0]));
        let sw = null;
        draft.customs.forEach((x, j) => {
          if (j >= i) return;
          if (!x) return;
          const pick = Overlay.SWATCHES.find((sw2) => sw2[0] && !usedHex.has(sw2[0]));
          if (pick) usedHex.add(pick[0]);
        });
        sw = Overlay.SWATCHES.find((sw2) => sw2[0] && !usedHex.has(sw2[0])) || null;
        if (sw) preview.style.cssText = `--c:${sw[0]};--cbg:${sw[1]};--cborder:${sw[0]}40;`;
        const row = U.el('div', { class: 'row', style: 'border-top:1px solid var(--border);' },
          preview,
          U.el('div', { style: 'flex:1; min-width:0;' }, inp, errEl),
          del);
        inp.addEventListener('input', () => {
          draft.customs[i] = inp.value.trim();
          errEl.style.display = 'none';
          preview.textContent = '';
          preview.append(U.el('span', { class: 'dot', 'aria-hidden': true }), document.createTextNode(draft.customs[i] || '…'));
          touch();
        });
        customsHolder.append(row);
      });
      if (!draft.customs.length) customsHolder.append(U.el('div', { class: 'empty muted' }, 'No custom statuses yet.'));
    }
    addStatusBtn.addEventListener('click', () => {
      draft.customs.push('');
      touch();
      drawCustoms();
      const inps = customsHolder.querySelectorAll('input');
      inps[inps.length - 1].focus();
    });
    statCard.append(statusesHolder, customsHolder,
      U.el('p', { class: 'setnote', text: 'The lifecycle defaults are locked — they are the spine of the job workflow. Custom statuses get their color automatically from a fixed accessible palette.' }));

    holder.append(labelsCard,
      U.el('div', { class: 'fieldgrid', style: 'align-items:start;' }, typesCard, statCard));

    /* ---------- dirty / save bar ---------- */
    const bar = U.el('div', { class: 'savbar', hidden: true },
      U.el('span', { id: 'dirtyCount', class: 'num' }),
      U.el('span', { class: 'sp' }),
      U.el('button', { class: 'btn ghost', type: 'button', text: 'Discard', onclick: () => discard() }),
      U.el('button', { class: 'btn primary', type: 'button', text: 'Save settings', onclick: () => save() }));
    document.getElementById('crmMount').append(bar);

    function touch() {
      const d = isDirty();
      bar.hidden = !d;
      bar.querySelector('#dirtyCount').textContent = `${changeCount()} unsaved change${changeCount() === 1 ? '' : 's'}`;
      setDirty(d);
    }

    function validate() {
      let count = 0;
      // labels
      for (const [key, r] of Object.entries(labelRows)) {
        const v = r.inp.value.trim();
        let msg = null;
        if (!v) msg = 'Label can’t be empty.';
        else if (v.length > 40) msg = 'Label is too long (max 40).';
        else {
          const dup = Object.entries(labelRows).find(([k2, r2]) => k2 !== key && r2.group === r.group && r2.inp.value.trim().toLowerCase() === v.toLowerCase());
          if (dup) msg = `Label duplicates another ${r.group.toLowerCase()} field.`;
        }
        r.errEl.textContent = msg || '';
        r.errEl.style.display = msg ? '' : 'none';
        r.inp.classList.toggle('invalid', !!msg);
        if (msg) count++;
        r.modPill.style.display = (v !== r.def) ? '' : 'none';
        r.defHint.style.display = (v !== r.def) ? '' : 'none';
        r.inp.closest('.setrow').querySelector('.btn').disabled = (v === r.def);
      }
      // types
      const seen = new Map();
      typesHolder.querySelectorAll('input').forEach((inp, i) => {
        const v = inp.value.trim();
        let msg = null;
        if (!v) msg = 'Type can’t be empty.';
        else if (seen.has(v.toLowerCase())) msg = 'Duplicate service type.';
        if (v) seen.set(v.toLowerCase(), true);
        const err = inp.parentElement.querySelector('.errmsg');
        err.textContent = msg || '';
        err.style.display = msg ? '' : 'none';
        inp.classList.toggle('invalid', !!msg);
        if (msg) count++;
      });
      // customs
      customsHolder.querySelectorAll('input').forEach((inp) => {
        const v = inp.value.trim();
        let msg = null;
        if (!v) msg = 'Status can’t be empty.';
        else if (coarseStatuses().includes(v) || allStatuses().filter((s) => Overlay.data.customs.includes(s)).some((s) => s.toLowerCase() === v.toLowerCase() && s !== v)) msg = 'Status already exists.';
        const err = inp.parentElement.querySelector('.errmsg');
        err.textContent = msg || '';
        err.style.display = msg ? '' : 'none';
        inp.classList.toggle('invalid', !!msg);
        if (msg) count++;
      });
      return count;
    }

    async function save() {
      const count = validate();
      if (count) {
        const bad = holder.querySelector('.errmsg:not([style*="none"])');
        if (bad) bad.scrollIntoView({ block: 'center' });
        toast(`${count} field${count === 1 ? '' : 's'} need${count === 1 ? 's' : ''} attention`, 'error');
        return;
      }
      try {
        // persist only the labels that differ from the backend defaults
        const lbls = {};
        Object.keys(baseLabels).forEach((k) => {
          if (draft.labels[k] !== undefined && draft.labels[k] !== (baseLabels[k] || '')) lbls[k] = draft.labels[k];
        });
        Overlay.save({
          labels: lbls,
          types: draft.types,
          customs: draft.customs,
          jobs: Overlay.data.jobs,
        });
        invalidateConfigCache();
        setDirty(false);
        toast('Settings saved');
        render();
      } catch (e) {
        toast(e instanceof ApiError ? e.message : 'Could not save settings.', 'error');
      }
    }

    function discard() {
      draft.labels = { ...Overlay.data.labels };
      draft.types = [...serviceTypes()];
      draft.customs = [...Overlay.data.customs];
      // re-render fresh
      setDirty(false);
      render();
    }

    resetBtn.addEventListener('click', () => {
      confirmDialog({
        title: 'Reset all settings',
        body: U.el('span', null, 'Restore every label, service type, and custom status to its default? This cannot be undone.'),
        confirmLabel: 'Reset all', danger: true,
        onConfirm: () => {
          Overlay.save({ labels: {}, types: null, customs: [], jobs: Overlay.data.jobs });
          invalidateConfigCache();
          setDirty(false);
          toast('Settings reset to defaults');
          render();
        },
      });
    });

    // initial paint
    drawTypes();
    drawCustoms();
    touch();
    // clean up on leave
    const onHash = () => {
      document.getElementById('crmMount').contains(bar) && bar.remove();
      window.removeEventListener('hashchange', onHash);
    };
    window.addEventListener('hashchange', onHash);
    // savebar must not block the dirty guard
    setDirty(isDirty());
  });
});

window.__crmBoot = function __crmBoot() { if (!window.__crmBooted) boot(); };
})();
/* ===== /CRM app ===== */
</script>
<script>
/* ===== CRM login glue (added by t_ec042054) =====
   The existing mock login (the block starting "LOGIN REQUEST (MOCK)")
   is NOT modified. This listens for its success — 'submit' on
   #loginAuthForm, then loginResponse gaining class 'ok' — and mounts
   the CRM. Session: localStorage 'llt_crm_auth_v1' (username + ts). */
(function () {
    var AUTH_KEY = 'llt_crm_auth_v1';
    var ORIGINAL_TITLE = document.title;
    var mount = document.getElementById('crmMount');
    if (!mount) return;

    function readAuth() {
        try {
            var a = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
            return (a && typeof a === 'object' && a.username) ? a : null;
        } catch (e) { return null; }
    }

    function showCrm() {
        mount.hidden = false;
        document.body.classList.add('crm-active');
        if (!/^#\/(dashboard|customers|vehicles|jobs|settings)/.test(location.hash)) {
            location.hash = '#/dashboard';
        }
        // boot once; later re-entries just un-hide the live SPA
        if (!mount.dataset.booted) {
            mount.dataset.booted = '1';
            if (typeof window.__crmBoot === 'function') window.__crmBoot();
        }
    }

    function hideCrm() {
        if (!mount.dataset.booted) return;
        mount.hidden = true;
        document.body.classList.remove('crm-active');
        document.title = ORIGINAL_TITLE;
    }

    function logout() {
        try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
        hideCrm();
    }

    // Existing login: submitAuth() -> mockAuthApi (~400ms) ->
    // loginResponse gains class 'ok'. Poll for it; give up after 2.5s.
    document.getElementById('loginAuthForm').addEventListener('submit', function () {
        var r = document.getElementById('loginResponse');
        var tries = 0;
        var iv = setInterval(function () {
            tries++;
            if (r.classList.contains('ok')) {
                clearInterval(iv);
                var u = (document.getElementById('loginUsername').value || 'owner').trim();
                try {
                    localStorage.setItem(AUTH_KEY, JSON.stringify({ username: u, at: new Date().toISOString() }));
                } catch (e) {}
                // host modal is z 2000 (above the CRM layer) — close it via
                // the host's own function; the login implementation is untouched
                if (typeof closeLoginModal === 'function') closeLoginModal();
                showCrm();
            } else if (tries >= 25) {
                clearInterval(iv);
            }
        }, 100);
    });

    // Session from a previous visit (page reload while logged in):
    // re-enter where the CRM was left off.
    if (readAuth()) showCrm();

    // QA / automation hooks (also used by the footer entry point)
    window.__crmAuth = { read: readAuth, show: showCrm, hide: hideCrm, logout: logout, key: AUTH_KEY };
})();
/* ===== /CRM login glue ===== */
</script>
