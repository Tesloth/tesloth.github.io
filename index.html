    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
            transition: var(--transition);
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Login Request (footer) - button, not anchor: the page's
           smooth-scroll handler binds a[href^="#"] and would throw
           on a bare "#" href. */
        .footer-links .login-link {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            cursor: pointer;
            color: rgba(255,255,255,0.8);
            opacity: 0.4;
            transition: var(--transition);
        }

        .footer-links .login-link:hover {
            color: var(--primary);
            opacity: 1;
            padding-left: 5px;
        }

        #loginModalOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        #loginModalOverlay.open {
            display: flex;
        }

        .login-modal {
            background: var(--light);
            color: var(--dark);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
            width: 90%;
            max-width: 420px;
            position: relative;
        }

        .login-modal h3 {
            color: var(--primary);
            margin-bottom: 8px;
        }

        .login-modal .modal-note {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .login-modal .close {
            position: absolute;
            top: 8px;
            right: 16px;
            font-size: 2rem;
            cursor: pointer;
            opacity: 0.6;
        }

        .login-modal .close:hover {
            opacity: 1;
        }

        .login-response {
            margin-top: 15px;
            font-weight: 600;
        }

        .login-response.ok {
            color: var(--success);
        }

        .login-response.err {
            color: var(--danger);
        }

        .login-back {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            margin-top: 10px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>

#crmMount {

}

/* ------------------------------- base -------------------------------- */


#crmMount {
  font-family: var(--font);
  font-size: 14px;
  line-height: 21px;
  font-weight: 400;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}

.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }

#crmMount h1 { font-size: 24px; line-height: 32px; font-weight: 600; }
#crmMount h2 { font-size: 18px; line-height: 26px; font-weight: 600; }
#crmMount h3 { font-size: 15px; line-height: 21px; font-weight: 600; }

#crmMount a { color: var(--crm-accent); text-decoration: none; }
#crmMount a:hover { text-decoration: underline; }

#crmMount button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }

#crmMount input, #crmMount select, #crmMount textarea { font: inherit; color: inherit; }

#crmMount :focus-visible { outline: 2px solid var(--crm-accent); outline-offset: 2px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skip {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--surface); padding: 10px 16px; border-radius: 0 0 6px 0;
  box-shadow: var(--shadow-card); font-weight: 500;
}
.skip:focus { left: 0; }

/* ------------------------------- shell ------------------------------- */

.app { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px 14px 14px;
}

.brand {
  font-size: 15px; line-height: 20px; font-weight: 600;
  padding: 4px 10px 16px; letter-spacing: .01em;
}
.brand .mark { color: var(--crm-accent); }

.btn-new { margin: 0 4px 14px; width: calc(100% - 8px); }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .it, .side-bottom .it {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; min-height: 38px;
  border-radius: 6px; font-size: 14px; font-weight: 500;
  color: var(--ink-soft); text-decoration: none; width: 100%; text-align: left;
}
.nav .it:hover, .side-bottom .it:hover { background: var(--hover-wash); text-decoration: none; }
.nav .it.active { background: var(--crm-accent-tint); color: var(--crm-accent); font-weight: 600; }
.side-bottom { margin-top: auto; border-top: 1px solid var(--border); padding-top: 8px; }

.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  height: var(--topbar-h);
  display: none; align-items: center; gap: 12px;
  padding: 0 16px;
  position: sticky; top: 0; z-index: 30;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.topbar .tbrand { font-weight: 600; font-size: 15px; }
.topbar .sp { flex: 1; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 20px; line-height: 1; color: var(--ink-soft);
}
.iconbtn:hover { background: var(--hover-wash); }

.tabbar {
  height: var(--tabbar-h);
  display: none;
  position: sticky; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--border);
  align-items: stretch; padding-bottom: env(safe-area-inset-bottom);
}
.tabbar .ti {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 11px; font-weight: 500; color: var(--ink-mute);
  min-height: 44px;
}
.tabbar .ti .tico { font-size: 20px; line-height: 1; }
.tabbar .ti.active { color: var(--crm-accent); }
.tabbar .plus {
  flex: 0 0 64px; display: flex; align-items: center; justify-content: center;
  font-size: 28px; color: var(--crm-accent); font-weight: 500;
}

.content {
  flex: 1;
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: 24px 32px 96px;
}

/* ---------------------------- quick add ------------------------------ */

.qamenu-wrap { position: relative; }
.qamenu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
  min-width: 190px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: var(--shadow-dialog);
  padding: 6px; display: none;
}
.qamenu.menu-r { left: auto; right: 0; }
.qamenu.open { display: block; }
.qamenu .mi {
  display: block; width: 100%; text-align: left;
  padding: 9px 12px; border-radius: 6px; font-size: 14px; font-weight: 500;
}
.qamenu .mi:hover { background: var(--hover-wash); }

/* ------------------------------ page bar ----------------------------- */

.bar {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  margin-bottom: 20px;
}
.bar .meta { font-size: 12px; line-height: 16px; color: var(--ink-mute); }
.bar .sp { flex: 1; }
.bar .actions { display: flex; gap: 10px; align-items: center; }

.crumbs { font-size: 13px; color: var(--ink-mute); margin-bottom: 8px; }
.crumbs a { color: var(--ink-mute); }
.crumbs a:hover { color: var(--crm-accent); }
.crumbs .sep { margin: 0 6px; }

/* ------------------------------- cards ------------------------------- */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow-card);
  padding: 16px 20px;
  margin-bottom: 20px;
}
.card .ct {
  font-size: 15px; font-weight: 600; margin-bottom: 10px;
  display: flex; align-items: center; gap: 10px;
}
.card .ct .meta { font-size: 12px; font-weight: 400; color: var(--ink-mute); }
.card .ct .sp { flex: 1; }

.row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 0;
  border-top: 1px solid var(--border);
  font-size: 14px;
}
.card .row:first-of-type, .card .rows .row:first-of-type { border-top: none; }
.row .sp { flex: 1; }
.row .rd { font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .rmeta { font-size: 12px; color: var(--ink-mute); }

/* ------------------------------ buttons ------------------------------ */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px;
  border-radius: 6px;
  font-size: 14px; font-weight: 500; line-height: 1;
  border: 1px solid transparent;
  transition: background-color 120ms ease-out, border-color 120ms ease-out, color 120ms ease-out;
  white-space: nowrap;
}
.btn:disabled { opacity: .55; cursor: not-allowed; }

.btn.primary { background: var(--crm-accent); color: var(--crm-accent-text-on); }
.btn.primary:hover:not(:disabled) { background: var(--crm-accent-press); }

.btn.secondary { background: var(--surface); border-color: var(--border-strong); color: var(--ink); }
.btn.secondary:hover:not(:disabled) { background: var(--hover-wash); }

.btn.ghost { color: var(--ink-soft); }
.btn.ghost:hover:not(:disabled) { background: var(--crm-accent-tint); color: var(--crm-accent); }

.btn.danger { background: var(--crm-danger); color: #fff; }
.btn.danger:hover:not(:disabled) { filter: brightness(.92); }
.btn.danger-ghost { color: var(--crm-danger); }
.btn.danger-ghost:hover:not(:disabled) { background: var(--crm-danger-bg); }

.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.full { width: 100%; }
.btn.text { height: auto; padding: 2px 4px; font-size: 13px; font-weight: 500; }

.spinner {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid currentColor; border-top-color: transparent;
  animation: spin 700ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ------------------------------- forms ------------------------------- */

.form-col { max-width: 560px; }
.form-col.wide { max-width: 640px; }
.form-col.settings { max-width: 720px; }

.sec-t {
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
  color: var(--ink-mute); margin: 22px 0 12px;
}
.sec-t:first-child { margin-top: 0; }

.field { margin-bottom: 16px; }
.field .lr { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.field label { font-size: 13.5px; font-weight: 500; }
.field label .req { color: var(--crm-danger); font-weight: 600; }
.field .counter { font-size: 12px; color: var(--ink-mute); }
.field .counter.warn { color: var(--crm-danger); }

.inp, select.inp, textarea.inp {
  width: 100%;
  height: 40px;
  padding: 0 12px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  font-size: 15px; line-height: 22px;
}
textarea.inp { height: auto; min-height: 64px; padding: 9px 12px; resize: vertical; }
.inp::placeholder { color: var(--ink-mute); opacity: .8; }
.inp.invalid { border-color: var(--crm-danger); }
.inp[readonly] { background: var(--hover-wash); color: var(--ink-mute); }

select.inp { appearance: none; background-image: none; padding-right: 30px; }
.selectwrap { position: relative; }
.selectwrap::after {
  content: ''; position: absolute; right: 13px; top: 50%; width: 8px; height: 8px;
  border-right: 1.5px solid var(--ink-soft); border-bottom: 1.5px solid var(--ink-soft);
  transform: translateY(-70%) rotate(45deg); pointer-events: none;
}

.curwrap { position: relative; }
.curwrap > .cur {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--ink-mute); font-size: 14px; pointer-events: none;
}
.curwrap .inp { padding-left: 26px; }
.inp.total-override { border-bottom: 2px solid var(--crm-accent); }

.errmsg { font-size: 12px; line-height: 16px; color: var(--crm-danger); margin-top: 5px; }
.hint { font-size: 12px; line-height: 16px; color: var(--ink-mute); margin-top: 5px; }

.lockrow {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--hover-wash);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px; margin-bottom: 16px;
  font-size: 14px;
}
.lockrow .lk { font-size: 12px; color: var(--ink-mute); }

.fieldgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.fieldgrid .field { margin-bottom: 16px; }

.formfoot {
  display: flex; align-items: center; gap: 12px;
  margin-top: 24px; padding-top: 16px;
  border-top: 1px solid var(--border);
}
.formfoot .sp { flex: 1; }

.savbar {
  position: fixed; left: var(--sidebar-w); right: 0; bottom: 0; z-index: 40;
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  box-shadow: 0 -4px 16px rgba(26, 23, 18, .08);
  padding: 12px 32px;
  font-size: 14px;
}
.savbar .sp { flex: 1; }
.savbar[hidden] { display: none; }

/* ------------------------------ search ------------------------------- */

.search {
  position: relative; margin-bottom: 16px;
}
.search .inp { height: 40px; padding-left: 38px; }
.search .sicon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--ink-mute); font-size: 15px; pointer-events: none;
}
.search .clear {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-soft); font-size: 16px;
}
.search .clear:hover { background: var(--hover-wash); }

/* ------------------------------- table ------------------------------- */

.tbl-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow-card);
  overflow-x: auto;
}
table.tbl { width: 100%; border-collapse: collapse; min-width: 640px; }
.tbl thead th {
  font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .03em;
  color: var(--ink-mute);
  text-align: left;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.tbl thead th .sortbtn {
  display: inline-flex; align-items: center; gap: 4px;
  font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit;
  padding: 2px 4px; margin: -2px -4px; border-radius: 4px;
}
.tbl thead th .sortbtn:hover { color: var(--ink); background: var(--hover-wash); }
.tbl thead th .arr { font-size: 10px; }
.tbl tbody td {
  padding: 10px 16px;
  font-size: 14px; line-height: 20px;
  border-top: 1px solid var(--border);
  vertical-align: middle;
}
.tbl tbody tr:first-child td { border-top: none; }
.tbl tbody tr.rowlink { cursor: pointer; }
.tbl tbody tr.rowlink:hover td { background: var(--hover-wash); }
.tbl tbody tr.rowlink:focus-visible { outline: 2px solid var(--crm-accent); outline-offset: -2px; }
.tbl tbody tr.rowlink.active td { background: var(--crm-accent-tint); }
.tbl .sub { font-size: 12px; color: var(--ink-mute); }
.tbl .cellnum { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .dash { color: var(--ink-mute); }

.pager {
  display: flex; align-items: center; gap: 12px;
  margin-top: 12px; font-size: 12px; color: var(--ink-mute);
}
.pager .sp { flex: 1; }

/* mobile card stack (customer list) */
.cstack { display: none; }
.mcard {
  display: block; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow-card);
  padding: 12px 14px; margin-bottom: 10px;
  font-size: 14px;
}
.mcard:hover { border-color: var(--border-strong); }
.mcard .t { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.mcard .s { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
.mcard .chev { margin-left: auto; color: var(--ink-mute); }

/* ------------------------------- chips ------------------------------- */

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 10px 2px 8px;
  border-radius: 999px;
  font-size: 12px; font-weight: 500; line-height: 18px;
  white-space: nowrap;
  color: var(--c, var(--ink-soft));
  background: var(--cbg, var(--hover-wash));
  border: 1px solid var(--cborder, var(--border));
}
.chip .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: currentColor;
}
.chip.selectable { cursor: pointer; }

.plate {
  display: inline-block;
  font-family: var(--mono); font-size: 12px; letter-spacing: .05em;
  padding: 1px 7px;
  border: 1px solid var(--border-strong); border-radius: 4px;
  background: var(--surface);
  text-transform: uppercase; white-space: nowrap;
}

/* --------------------------- vehicles, tl ---------------------------- */

.vgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.vcard {
  display: block; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow-card);
  padding: 14px 16px;
  font-size: 14px;
  transition: border-color 120ms ease-out;
}
.vcard:hover { border-color: var(--crm-accent); }
.vcard .vn { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.vcard .vm { font-size: 13px; color: var(--ink-soft); margin-top: 3px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.vcard .vm .meta { font-size: 12px; color: var(--ink-mute); }

.tl .yhead {
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
  color: var(--ink-mute);
  margin: 14px 0 4px;
}
.tl .yhead:first-child { margin-top: 4px; }
.te {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr) auto auto;
  gap: 12px; align-items: baseline;
  padding: 10px 0;
  border-top: 1px solid var(--border);
  cursor: pointer;
}
.te:first-child { border-top: none; }
.te .d { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink-soft); }
.te .sum { font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.te .sub { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
.te .tot { font-variant-numeric: tabular-nums; font-size: 14px; white-space: nowrap; }
.te .exp { font-size: 12px; color: var(--ink-mute); white-space: nowrap; }
.te .tlx {
  grid-column: 1 / -1;
  display: grid; grid-template-rows: 0fr; transition: grid-template-rows 150ms ease-out;
}
.te.open .tlx { grid-template-rows: 1fr; }
.te .tlx > div { overflow: hidden; }
.te .detail {

    <div id="loginModalOverlay" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">

                    <div class="form-group">

                    </div>

                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="Password" autocomplete="off">
                    </div>
                    <button id="loginAuthSubmit" type="submit" class="cta-button">Sign In</button>
                </form>
                <button type="button" class="login-back" onclick="backToPassphrase()">&larr; Use a different passphrase</button>
            </div>

    <script>


        /**************** LOGIN REQUEST (MOCK) ****************
         * Flow: footer link -> passphrase -> FNV-1a 32-bit ->
         * gate API -> login form + auth URL -> auth API.
         * The gate and the auth API are SEPARATE endpoints;
         * the browser orchestrates both. The real gate lives at
         * /api/gate (Pages Function, not built yet) -
         * mockGateApi/mockAuthApi below simulate it for now.
         */
        // Demo-only: FNV-1a 32-bit of the test passphrase "testpass".
        // In the real gate this value is a server-side secret (env.GATE_HASH),
        // never present in the page.
        const MOCK_GATE_HASH = 0xad78b138;

        function fnv1a32(str) {
            let h = 2166136261; // 0x811c9dc5
            const bytes = new TextEncoder().encode(str); // UTF-8 bytes
            for (const b of bytes) {
                h ^= b;
                h = Math.imul(h, 16777619) >>> 0;
            }
            return h;
        }

        const loginOverlay = document.getElementById('loginModalOverlay');
        const loginPassSection = document.getElementById('loginPassSection');
        const loginAuthSection = document.getElementById('loginAuthSection');
        const loginAuthForm = document.getElementById('loginAuthForm');
        const loginResponse = document.getElementById('loginResponse');

        function openLoginModal(event) {
            if (event) event.preventDefault();
            loginOverlay.classList.add('open');
            setLoginStage('pass');
            document.getElementById('loginPassphrase').focus();
        }

        function closeLoginModal() {
            loginOverlay.classList.remove('open');
            setLoginStage('pass');
            loginResponse.textContent = '';
        }

        function setLoginResponse(text, kind) {
            loginResponse.textContent = text;
            loginResponse.className = 'login-response' + (kind ? ' ' + kind : '');
        }

        function setLoginStage(stage) {
            const auth = stage === 'auth';
            loginPassSection.style.display = auth ? 'none' : 'block';
            loginAuthSection.style.display = auth ? 'block' : 'none';
            if (!auth) {
                document.getElementById('loginPassphrase').value = '';
                loginAuthForm.reset();
                loginAuthForm.action = '';
            }
        }

        function backToPassphrase() {
            setLoginStage('pass');
            setLoginResponse('', '');
            document.getElementById('loginPassphrase').focus();
        }

        // Simulated gate API (POST /api/gate).
        // Real version: fetch('/api/gate', { method: 'POST', body: JSON.stringify({ hash }) }).
        // Returns the same shape the real gate will:
        //   match: { ok: true,  authUrl: '<real auth api url>' }
        //   no:    { ok: false, error: 'Invalid access code.' }
        function mockGateApi(hash) {
            return new Promise(resolve => {
                setTimeout(() => {
                    resolve(hash === MOCK_GATE_HASH
                        ? { ok: true, authUrl: '/api/auth' }
                        : { ok: false, error: 'Invalid access code.' });
                }, 400);
            });
        }

        // Simulated auth API (the separate backend that touches the DB, not built yet).
        // Real version: fetch(authUrl, { method: 'POST', body: JSON.stringify({ username, password }) }).
        // Mock accepts any non-empty username/password and returns the final
        // authenticated response (a session token would live here in the real backend).
        function mockAuthApi(username, password) {
            return new Promise(resolve => {
                setTimeout(() => {
                    resolve({ ok: true, message: 'Authenticated (mock): ' + username });
                }, 400);
            });
        }

        async function requestLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('loginPassSubmit');
            const hash = fnv1a32(document.getElementById('loginPassphrase').value);
            btn.disabled = true;
            btn.textContent = 'Checking...';
            setLoginResponse('', '');
            const res = await mockGateApi(hash);
            btn.disabled = false;
            btn.textContent = 'Submit';
            if (res.ok) {
                loginAuthForm.action = res.authUrl;
                setLoginStage('auth');
                document.getElementById('loginUsername').focus();
            } else {
                setLoginResponse(res.error, 'err');
            }
        }

        async function submitAuth(event) {
            event.preventDefault();
            const btn = document.getElementById('loginAuthSubmit');
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            if (!username || !password) {
                setLoginResponse('Please enter both username and password.', 'err');
                return;
            }
            btn.disabled = true;
            btn.textContent = 'Signing In...';
            setLoginResponse('', '');
            const res = await mockAuthApi(username, password);
            btn.disabled = false;
            btn.textContent = 'Sign In';
            if (res.ok) {
                setLoginResponse(res.message, 'ok');
            } else {
                setLoginResponse(res.error || 'Authentication failed.', 'err');
            }
        }
    </script>

 * places. `total` is always recomputed by the API as round(labor + parts,
 * 2) — pass whatever you like and the stored value is canonical.
 * Dates: `job.date` is 'YYYY-MM-DD'; createdAt/updatedAt are ISO-8601
 * UTC ('...Z').
 *
 * LIST ORDER
 *   customers.list() -> name, case-insensitive
 *   vehicles.list()  -> id (creation order)
 *   jobs.list()      -> date descending, then id (service-history
 *                       order; a `?sort='date_asc'` style param is a
 *                       later UI concern — the API exposes the
 *                       `dir` option documented below)
 *
 * METHODS (each returns a Promise):
 *   crm.seed()                       -> { customers, vehicles, jobs, config }
 *                                      Load deterministic demo data,
 *                                      wiping any persisted data first.
 *                                      Runs automatically on first load
 *                                      when no persisted data exists.
 *   crm.reset()                      -> { cleared: true }
 *                                      Wipe persisted data; next
 *                                      auto-load re-seeds.
 *
 *   crm.getCustomers(opts)           -> Customer[]
 *   crm.getCustomer(id)              -> Customer
 *   crm.createCustomer(input)        -> Customer
 *   crm.updateCustomer(id, input)    -> Customer
 *   crm.deleteCustomer(id)           -> { deleted: id }
 *
 *   crm.getVehicles(opts)            -> Vehicle[]
 *   crm.getVehicle(id)                -> Vehicle
 *   crm.createVehicle(input)         -> Vehicle
 *   crm.updateVehicle(id, input)     -> Vehicle
 *   crm.deleteVehicle(id)            -> { deleted: id }
 *
 *   crm.getJobs(opts)                 -> Job[]
 *   crm.getJob(id)                    -> Job
 *   crm.createJob(input)              -> Job
 *   crm.updateJob(id, input)          -> Job
 *   crm.deleteJob(id)                 -> { deleted: id }
 *
 *   crm.getDashboard()                -> Dashboard summary (see below)
 *
 * Entity shapes:
 *
 *   Customer { id, name, phone, email, address, notes, createdAt, updatedAt }
 *   Vehicle  { id, customerId, make, model, year, vin, plate, mileage,
 *              createdAt, updatedAt }
 *   Job      { id, customerId, vehicleId, date, status, description,
 *              labor, parts, total, technician, notes, createdAt, updatedAt }
 *
 * List query options (all optional):
 *
 *   customers.list({ q })              q: case-insensitive substring
 *                                       matched against name, phone, email
 *   vehicles.list({ customerId })      filter to one customer
 *   jobs.list({ customerId, vehicleId,
 *                    status, q, dir })
 *     q  -> matches description or technician
 *     dir -> 'date_desc' (default) | 'date_asc'; ties break by id
 *
 * create/update input rules:
 *   - `id` and timestamps are generated/managed by the API; sending
 *     them is ignored.
 *   - create: every required field must be present (see REQUIRED below);
 *     `status` defaults to config.defaultStatus on job create when
 *     omitted; `total` is recomputed.
 *   - update: partial — only the fields you pass are changed. A
 *     customer/vehicle id change on an existing job is allowed (re-
 *     validated for existence).
 *   - Required fields, per entity:
 *       customer: name, phone
 *       vehicle:  customerId, make, model, year, vin, plate
 *       job:      customerId, vehicleId, date, description, labor, parts
 *     Optional (default ''): customer.notes/email/address,
 *     vehicle.mileage (default 0), job.status/technician/notes.
 *
 * Validation errors (rejected as ApiError code 'validation'):
 *   - name/make/model/description: non-empty string
 *   - phone: non-empty string
 *   - email: RFC-5322-lite check when non-empty
 *   - year: integer, 1900..currentYear+1
 *   - vin: 17 chars, no I/O/Q
 *   - plate: non-empty
 *   - mileage: integer >= 0
 *   - labor/parts: number >= 0 (0 allowed)
 *   - date: 'YYYY-MM-DD' and a real calendar date
 *   - status: must be in config.statuses
 *   - referential: customerId / vehicleId must exist (on create and
 *     on update), and a job's vehicle must belong to the same customer
 *     as the job's customerId
 *
 * Delete rules:
 *   - deleteCustomer: BLOCKED with 'conflict' while the customer has
 *     vehicles or jobs (cascade is a product decision, not a mock
 *     detail).
 *   - deleteVehicle:  BLOCKED with 'conflict' while jobs reference it.
 *   - deleteJob:      always allowed.
 *
 * Dashboard shape (getDashboard()):
 *   {
 *     counts: { customers, vehicles, openJobs, inProgressJobs,
 *               completedJobs, cancelledJobs },
 *     recentJobs: Job[]          // last 5, date desc, then id
 *     upcoming:   Job[]          // status 'open' AND date >= today,
 *                                 // date asc, then id
 *     monthRevenue: { month: 'YYYY-MM', total: number }
 *                                // sum of totals of jobs dated in the
 *                                // current UTC month
 *   }
 */



class ApiError extends Error {
  /**
   * @param {string} code 'not_found' | 'validation' | 'conflict'
   * @param {string} message
   * @param {Object<string,string>} [errors] field-level messages, validation only
   */
  constructor(code, message, errors) {
    super(message);
    this.name = 'ApiError';
    this.code = code;
    this.errors = errors || null;
  }
}

const STORAGE_KEY = 'llt_crm_v1';
const ENTITIES = ['customers', 'vehicles', 'jobs', 'config'];
const REQUIRED = {
  customer: ['name', 'phone'],
  vehicle: ['customerId', 'make', 'model', 'year', 'vin', 'plate'],
  job: ['customerId', 'vehicleId', 'date', 'description', 'labor', 'parts'],
};
const OPTIONAL_DEFAULTS = {
  customer: { email: '', address: '', notes: '' },
  vehicle: { mileage: 0 },
  job: { status: null, technician: '', notes: '' }, // status: config default
};
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

/* ----------------------------- storage layer ----------------------------- */

/** In-memory Storage lookalike (same shape as window.localStorage). */
class MemoryStorage {
  constructor() {
    this.map = new Map();
  }
  getItem(k) {
    return this.map.has(k) ? this.map.get(k) : null;
  }
  setItem(k, v) {
    this.map.set(k, String(v));
  }
  removeItem(k) {
    this.map.delete(k);
  }
  clear() {
    this.map.clear();
  }
}

/**
 * localStorage-backed storage; safe to construct on Node (no browser
 * APIs touched until an operation runs, and operations guard with a
 * capability check) — but in Node you want MemoryStorage instead.
 */
class LocalStorageBackend {
  get() {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    try {
      return JSON.parse(raw);
    } catch {
      // Corrupt payload: treat as empty so the app can re-seed.
      return null;
    }
  }
  set(db) {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  }
  clear() {
    window.localStorage.removeItem(STORAGE_KEY);
  }
}

/* --------------------------------- utils --------------------------------- */

const isPlainObject = (v) =>
  typeof v === 'object' && v !== null && !Array.isArray(v);
const isInt = (v) => Number.isInteger(v);
const clampMoney = (v) => Math.round(v * 100) / 100;
const isoNow = () => new Date().toISOString();
const todayUtc = () => isoNow().slice(0, 10);
const byNameI = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });

/** Minimal deep clone for seed/record copies (no functions, no cycles). */
const clone = (v) => JSON.parse(JSON.stringify(v));

/* ------------------------------ validation ------------------------------- */

function validateEntity(kind, data, { forUpdate = false } = {}) {
  const errors = {};
  const missing = [];

  const required = forUpdate
    ? []
    : REQUIRED[kind].filter((f) => !(kind === 'job' && f === 'status'));

  const present = (f) => {
    const v = data[f];
    if (v === undefined || v === null || v === '') missing.push(f);
    return !missing.includes(f);
  };
  const isNumish = (v) => typeof v === 'number' && Number.isFinite(v);

  required.forEach((f) => {
    if (!present(f)) {
      errors[f] = `${f} is required`;
      return;
    }
    const v = data[f];
    const bad =
      (f === 'year' || f === 'mileage' || f === 'labor' || f === 'parts'
        ? !isNumish(v)
        : f === 'status'
          ? typeof v !== 'string' || !v
          : typeof v !== 'string' || v.trim() === '');
    if (bad) errors[f] = `${f} has an invalid type or is missing`;
  });
  if (missing.length) errors._required = missing.join(', ');

  // Field-specific rules (only for values that passed the type gate).
  if (kind === 'customer') {
    if (typeof data.email === 'string' && data.email !== '' && !EMAIL_RE.test(data.email))
      errors.email = 'email is not a valid address';
  }
  if (kind === 'vehicle') {
    if (isInt(data.year) && (data.year < 1900 || data.year > new Date().getFullYear() + 1))
      errors.year = `year must be 1900..${new Date().getFullYear() + 1}`;
    if (typeof data.vin === 'string' && data.vin !== '' && !/^[A-HJ-NPR-Z0-9]{17}$/i.test(data.vin))
      errors.vin = 'vin must be 17 characters, letters (no I, O, Q) and digits';
    if (isInt(data.mileage) && data.mileage < 0) errors.mileage = 'mileage must be >= 0';
    if (present('mileage') && !isInt(data.mileage)) errors.mileage = 'mileage must be a whole number';
  }
  if (kind === 'job') {
    if (typeof data.date === 'string' && data.date !== '' && !validDate(data.date))
      errors.date = 'date must be a real YYYY-MM-DD calendar date';
    if (present('date') && (typeof data.date !== 'string' || !DATE_RE.test(data.date)))
      errors.date = 'date must be a YYYY-MM-DD string';
    for (const f of ['labor', 'parts']) {
      if (present(f)) {
        if (typeof data[f] !== 'number' || !Number.isFinite(data[f])) errors[f] = `${f} must be a number`;
        else if (data[f] < 0) errors[f] = `${f} must be >= 0`;
      }
    }
  }
  return errors;
}

function validDate(s) {
  if (!DATE_RE.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
}

/* ---------------------------------- api ---------------------------------- */

class CrmApi {
  /**
   * @param {object} [options]
   * @param {StorageLike} [options.storage]  In-memory or any localStorage-
   *   shaped object. Default: window.localStorage in browsers,
   *   MemoryStorage on Node.
   * @param {boolean} [options.persist]      false = never write to storage
   *   (purely in-memory session; seed auto-load still applies).
   * @param {() => string} [options.now]     Injectable clock, ISO string.
   *   Used for timestamps, dashboard 'today', and year validation bounds.
   *   Tests pass a fixed clock for determinism.
   */
  constructor(options = {}) {
    const inBrowser = typeof window !== 'undefined' && !!window.localStorage;
    if (options.storage) this.storage = options.storage;
    else if (inBrowser) this.storage = new LocalStorageBackend();
    else this.storage = new MemoryStorage();
    this.persist = options.persist !== false && (inBrowser || !!options.storage);
    this.clock = options.now || isoNow;
    this._db = null;
  }

  /* ------------------------------ lifecycle ------------------------------ */

  _load() {
    if (this._db) return this._db;
    const raw = this._read();
    if (raw && this._dbShapeOk(raw)) {
      this._db = raw;
    } else {
      this._db = this._freshDb(); // first run: deterministic seed
      this._write();
    }
    return this._db;
  }

  _read() {
    try {
      if (this.storage instanceof LocalStorageBackend) return this.storage.get();
      const raw = this.storage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }

  _write() {
    if (this.persist) {
      try {
        if (this.storage instanceof LocalStorageBackend) this.storage.set(this._db);
        else this.storage.setItem(STORAGE_KEY, JSON.stringify(this._db));
      } catch (e) {
        console.warn('llt-crm: persist failed (continuing in-memory)', e);
      }
    }
  }

  _freshDb() {
    return clone(SEED);
  }

  _dbShapeOk(db) {
    return (
      isPlainObject(db) &&
      ENTITIES.every((k) => Array.isArray(db[k]) || k === 'config') &&
      Array.isArray(db.customers) &&
      Array.isArray(db.vehicles) &&
      Array.isArray(db.jobs)
    );
  }

  _fail(code, message, errors) {
    throw new ApiError(code, message, errors);
  }

  /** Load the deterministic seed, wiping any persisted data first. */
  async seed() {
    this._db = this._freshDb();
    this._write();
    return clone(this._db);
  }

  /** Wipe persisted data; the next load re-seeds. */
  async reset() {
    this._db = null;
    if (this.storage instanceof LocalStorageBackend) this.storage.clear();
    else this.storage.removeItem(STORAGE_KEY);
    this._load(); // re-seed immediately so the app keeps working
    return { cleared: true };
  }

  /* ------------------------------ helpers ------------------------------- */

  _col(name) {
    return this._load()[name];
  }

  _get(col, id) {
    const rec = this._col(col).find((r) => r.id === id);
    if (!rec) this._fail('not_found', `${col} ${id} not found`);
    return rec;
  }

  _findIndex(col, id) {
    return this._col(col).findIndex((r) => r.id === id);
  }

  _nextId(col, prefix) {
    const max = this._col(col).reduce((m, r) => Math.max(m, Number(String(r.id).slice(prefix.length)) || 0), 0);
    return `${prefix}${String(max + 1).padStart(3, '0')}`;
  }

  _apply(col, kind, input, id) {
    const data = { ...input };
    delete data.id;
    delete data.createdAt;
    delete data.updatedAt;
    delete data.total; // recomputed, never trusted
    const errors = validateEntity(kind, data, { forUpdate: !!id });
    if (Object.keys(errors).length) this._fail('validation', 'Invalid input', errors);

    // Referential checks.
    if (kind === 'vehicle' && 'customerId' in data)
      this._get('customers', data.customerId);
    if (kind === 'job') {
      const customerId = 'customerId' in data ? data.customerId : this._get('jobs', id).customerId;
      const vehicleId = 'vehicleId' in data ? data.vehicleId : this._get('jobs', id).vehicleId;
      const customer = this._get('customers', customerId);
      const vehicle = this._get('vehicles', vehicleId);
      if (vehicle.customerId !== customer.id)
        this._fail(
          'validation',
          'job vehicle does not belong to the job customer',
          { vehicleId: `vehicle ${vehicleId} belongs to customer ${vehicle.customerId}, not ${customer.id}` }
        );
    }
    // Status check (create default + update).
    if (kind === 'job') {
      const status = 'status' in data ? data.status : null;
      if (status !== null && !this._load().config.statuses.includes(status))
        this._fail('validation', `status must be one of: ${this._load().config.statuses.join(', ')}`, {
          status: 'unknown status',
        });
    }

    const now = this.clock();
    if (id) {
      const rec = this._get(col, id);
      Object.assign(rec, data, { updatedAt: now });
      if (kind === 'job') rec.total = clampMoney(rec.labor + rec.parts);
      return rec;
    }
    const rec = {
      ...(kind === 'customer'
        ? { name: data.name, phone: data.phone, email: data.email ?? '', address: data.address ?? '', notes: data.notes ?? '' }
        : kind === 'vehicle'
          ? { customerId: data.customerId, make: data.make, model: data.model, year: data.year, vin: data.vin, plate: data.plate, mileage: data.mileage ?? 0 }
          : {
              customerId: data.customerId,
              vehicleId: data.vehicleId,
              date: data.date,
              status: data.status ?? this._load().config.defaultStatus,
              description: data.description,
              labor: clampMoney(data.labor),
              parts: clampMoney(data.parts),
              total: 0,
              technician: data.technician ?? '',
              notes: data.notes ?? '',
            }),
      createdAt: now,
      updatedAt: now,
    };
    if (kind === 'job') rec.total = clampMoney(rec.labor + rec.parts);
    rec.id = this._nextId(col, kind === 'customer' ? 'c' : kind === 'vehicle' ? 'v' : 'j');
    // Keep ids stable: assign before any later validation that needs them.
    this._col(col).push(rec);
    return rec;
  }

  _delete(col, kind, id) {
    const db = this._load();
    if (this._findIndex(col, id) === -1) this._fail('not_found', `${col} ${id} not found`);
    if (kind === 'customer') {
      const vehicles = db.vehicles.filter((v) => v.customerId === id).length;
      const jobs = db.jobs.filter((j) => j.customerId === id).length;
      if (vehicles || jobs)
        this._fail(
          'conflict',
          `customer ${id} still has ${vehicles} vehicle(s) and ${jobs} job(s); delete or reassign them first`
        );
    }
    if (kind === 'vehicle') {
      const jobs = db.jobs.filter((j) => j.vehicleId === id).length;
      if (jobs)
        this._fail('conflict', `vehicle ${id} still has ${jobs} job(s); delete or reassign them first`);
    }
    const arr = db[col];
    arr.splice(arr.findIndex((r) => r.id === id), 1);
    this._write();
    return { deleted: id };
  }

  /* ------------------------------ customers ------------------------------ */

  async getCustomers(opts = {}) {
    let rows = clone(this._load().customers);
    if (opts.q) {
      const q = String(opts.q).toLowerCase();
      rows = rows.filter(
        (c) => c.name.toLowerCase().includes(q) || c.phone.includes(q) || c.email.toLowerCase().includes(q)
      );
    }
    return rows.sort(byNameI);
  }

  async getCustomer(id) {
    return clone(this._get('customers', id));
  }

  async createCustomer(input) {
    const rec = this._apply('customers', 'customer', input, null);
    this._write();
    return clone(rec);
  }

  async updateCustomer(id, input) {
    this._apply('customers', 'customer', input, id);
    this._write();
    return clone(this._get('customers', id));
  }

  async deleteCustomer(id) {
    this._delete('customers', 'customer', id);
    return { deleted: id };
  }

  /* ------------------------------- vehicles ------------------------------ */

  async getVehicles(opts = {}) {
    let rows = clone(this._load().vehicles);
    if (opts.customerId) rows = rows.filter((v) => v.customerId === opts.customerId);
    return rows; // id order == creation order
  }

  async getVehicle(id) {
    return clone(this._get('vehicles', id));
  }

  async createVehicle(input) {
    const rec = this._apply('vehicles', 'vehicle', input, null);
    this._write();
    return clone(rec);
  }

  async updateVehicle(id, input) {
    this._apply('vehicles', 'vehicle', input, id);
    this._write();
    return clone(this._get('vehicles', id));
  }

  async deleteVehicle(id) {
    this._delete('vehicles', 'vehicle', id);
    return { deleted: id };
  }

  /* --------------------------------- jobs -------------------------------- */

  async getJobs(opts = {}) {
    let rows = clone(this._load().jobs);
    if (opts.customerId) rows = rows.filter((j) => j.customerId === opts.customerId);
    if (opts.vehicleId) rows = rows.filter((j) => j.vehicleId === opts.vehicleId);
    if (opts.status) rows = rows.filter((j) => j.status === opts.status);
    if (opts.q) {
      const q = String(opts.q).toLowerCase();
      rows = rows.filter((j) => j.description.toLowerCase().includes(q) || j.technician.toLowerCase().includes(q));
    }
    const dir = opts.dir === 'date_asc' ? 1 : -1;
    rows.sort((a, b) => (a.date === b.date ? (a.id < b.id ? -1 : 1) : a.date < b.date ? -dir : dir));
    return rows;
  }

  async getJob(id) {
    return clone(this._get('jobs', id));
  }

  async createJob(input) {
    const rec = this._apply('jobs', 'job', input, null);
    this._write();
    return clone(rec);
  }

  async updateJob(id, input) {
    this._apply('jobs', 'job', input, id);
    this._write();
    return clone(this._get('jobs', id));
  }

  async deleteJob(id) {
    this._delete('jobs', 'job', id);
    return { deleted: id };
  }

  /* ------------------------------- dashboard ----------------------------- */

  async getDashboard() {
    const db = this._load();
    const today = this.clock().slice(0, 10);
    const counts = { customers: db.customers.length, vehicles: db.vehicles.length };
    for (const s of db.config.statuses) counts[statusCountKey(s)] = 0;
    for (const j of db.jobs) counts[statusCountKey(j.status)]++;

    const recentJobs = (await this.getJobs({ dir: 'date_desc' })).slice(0, 5);
    const upcoming = (await this.getJobs({ status: 'open', dir: 'date_asc' })).filter((j) => j.date >= today);
    const month = today.slice(0, 7);
    const monthRevenue = {
      month,
      total: clampMoney(db.jobs.filter((j) => j.date.startsWith(month)).reduce((s, j) => s + j.total, 0)),
    };
    return { counts, recentJobs, upcoming, monthRevenue };
  }
}

const statusCountKey = (s) =>
  ({
    open: 'openJobs',
    in_progress: 'inProgressJobs',
    completed: 'completedJobs',
    cancelled: 'cancelledJobs',
  })[s] || `${s}Jobs`;
</script>
<script>
/* ===== CRM app (integrated build; mounts inside #crmMount) ===== */
(function () {
window.__crmBooted = false;
/* ============================================================

   - lib/api.js exposes config READ-ONLY (no config-write method)
     and Job has no serviceType column. The configurability
     surface of the design spec (labels, service types, custom

     overlay (localStorage key llt_crm_overlay_v1) that sits on

'use strict';

/* ------------------------------ utils ------------------------------ */

function crmExit(e) { if (e) e.preventDefault(); if (window.__crmAuth && window.__crmAuth.hide) window.__crmAuth.hide(); }
function crmLogout(e) { if (e) e.preventDefault(); if (window.__crmAuth && window.__crmAuth.logout) window.__crmAuth.logout(); }

  parseDate(s) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return null;
    const [y, m, d] = s.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d ? dt : null;
  },
  todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  },
  addDaysISO(iso, days) {
    const d = U.parseDate(iso) || new Date();
    d.setDate(d.getDate() + days);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  },
  daysBetween(aISO, bISO) {
    const a = U.parseDate(aISO), b = U.parseDate(bISO);
    if (!a || !b) return 0;
    return Math.round((b - a) / 86400000);
  },
  /* "Sep 26" for the current year, "Sep 28, 2025" otherwise */
  day(s) {
    const d = U.parseDate(s);
    if (!d) return s;
    const now = new Date();
    const opt = { month: 'short', day: 'numeric' };
    if (d.getFullYear() !== now.getFullYear()) opt.year = 'numeric';
    return d.toLocaleDateString('en-US', opt);
  },
  full(s) {
    const d = U.parseDate(s);
    return d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : (s || '—');
  },
  longToday() {
    return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  },
  vehicleName(v) {
    return `${v.year} ${v.make} ${v.model}`.replace(/\s+/g, ' ').trim();
  },
  vehicleShort(v) {
    return `${String(v.year).slice(2)} ${v.make} ${v.model}`;
  },
  svgIcon(name) {
    const paths = {
      users: '<path d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm-8 0a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 3c-3.3 0-8 1.7-8 5v2h16v-2c0-3.3-4.7-5-8-5Zm8 0c-.5 0-1 .04-1.5.11A5.5 5.5 0 0 1 17 16v2h6v-2c0-3.3-4.7-5-8-5Z"/>',
      wrench: '<path d="M21.7 6.3a5.5 5.5 0 0 1-7.4 6.5L7 20.1a2.5 2.5 0 0 1-3.5-3.5l7.3-7.3a5.5 5.5 0 0 1 6.5-7.4L14 5.2l2.8 2.8 4.9-1.7Z"/>',
      car: '<path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11m-14 0h14m-14 0a2 2 0 0 0-2 2v4h2m14-6a2 2 0 0 1 2 2v4h-2m-14 0v2h3v-2m11 0v2h3v-2m-14 0h11M7.5 14h.01M16.5 14h.01"/>',
      doc: '<path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm7 0v5h5M9 13h6M9 17h6"/>',
      check: '<path d="M20 6L9 17l-5-5"/>',
      search: '<path d="M11 4a7 7 0 1 0 4.4 12.6l4.5 4.5 1.4-1.4-4.5-4.5A7 7 0 0 0 11 4Zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"/>',
      plus: '<path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7V4Z"/>',
    };
    const n = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    n.setAttribute('viewBox', '0 0 22 22');
    n.setAttribute('width', name === 'search' ? 18 : 32);
    n.setAttribute('height', name === 'search' ? 18 : 32);
    n.setAttribute('fill', 'none');
    n.setAttribute('stroke', 'currentColor');
    n.setAttribute('stroke-width', '1.6');

const Overlay = {
  KEY: 'llt_crm_overlay_v1',
  /* fixed AA palette per spec §4.1 — the 6 colored core swatches plus
     5 additional (plum, teal, slate, moss, rust). Paid is neutral. */
  SWATCHES: [
    ['#2E6E8E', '#E3F0F7'], ['#8A5A00', '#FBEED8'], ['#A6450C', '#F9E7DE'],
    ['#2E7D4F', '#E1F2E8'], ['#4A5FA5', '#E6EAF5'], ['#B3261E', '#F9E4E2'],
    ['#7A4A8E', '#F0E6F3'], ['#2E7D74', '#E2F1EF'], ['#4A5568', '#E8EAEF'],
    ['#5A7A2E', '#EDF2E2'], ['#8E4A4A', '#F3E6E6'],
  ],
  /* display-name fallbacks, used only when the backend config lacks a
     key or is missing entirely (the seed config is the source of truth) */
  DEFAULT_LABELS: {
    name: 'Name', phone: 'Phone', email: 'Email', address: 'Address', notes: 'Notes',
    make: 'Make', model: 'Model', year: 'Year', vin: 'VIN', plate: 'License plate', mileage: 'Mileage',
    date: 'Date', status: 'Status', description: 'Description',
    labor: 'Labor', parts: 'Parts', total: 'Total', technician: 'Technician',
  },
  DEFAULT_TYPES: ['Oil Change', 'Tires & Wheels', 'Brakes', 'Engine & Drivetrain', 'Cooling & A/C', 'Diagnostics', 'Electrical', 'General Repair'],
  data: { labels: {}, types: null, customs: [], jobs: {} },

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        const d = JSON.parse(raw);
        this.data = {
          labels: d.labels || {},
          types: Array.isArray(d.types) ? d.types : null,
          customs: Array.isArray(d.customs) ? d.customs : [],
          jobs: d.jobs && typeof d.jobs === 'object' ? d.jobs : {},
        };
      }
    } catch { /* corrupt overlay = pristine */ }
  },
  save(data) {
    this.data = data || this.data;
    try {
      localStorage.setItem(this.KEY, JSON.stringify(this.data));
    } catch (e) {
      console.warn('llt-crm: overlay save failed', e);
      throw new ApiError('conflict', 'Could not save settings (local storage unavailable).');
    }
  },
  jobEx(jobId) {
    return (this.data.jobs && this.data.jobs[jobId]) || null;
  },
  setJobEx(jobId, patch) {
    this.data.jobs[jobId] = { ...(this.data.jobs[jobId] || {}), ...patch };
    this.save();
  },
};

/* --------------------------- config model --------------------------
   The backend config is the single source of truth for shopName,
   fieldLabels, and the legal coarse job statuses (config.statuses).
   The overlay carries the configurability surface the backend cannot
   persist: label renames, custom service types, custom statuses, and
   per-job rich status / service type / odometer.

   The rich status list is config.statuses (displayed with friendly
   titles) plus any custom statuses the owner added — every rich status
   maps to a legal coarse status, so the UI can never send the backend
   an illegal value. */

let cfgCache = null;
function coarseStatuses() { return (cfgCache && cfgCache.statuses) || ['open', 'in_progress', 'completed', 'cancelled']; }
function coarseForRich(status) {
  const i = Overlay.data.customs.indexOf(status);
  const cycle = coarseStatuses();
  return cycle[((i % cycle.length) + cycle.length) % cycle.length];
}
/* rich status of a job: overlay wins, else the job's own coarse status */
function jobStatus(job) {
  const ex = Overlay.jobEx(job.id);
  if (ex && ex.status) return ex.status;
  return job.status;
}
function allStatuses() {
  return [...coarseStatuses(), ...Overlay.data.customs];
}
function isCustomStatus(name) {
  return Overlay.data.customs.includes(name);
}
/* the coarse backend status a rich/custom status maps to */
function coarseOf(status) {
  return isCustomStatus(status) ? coarseForRich(status) : status;
}
/* display name for a status: customs show as typed; backend statuses
   show their friendly title (config.statusLabels when present) */
const FRIENDLY_STATUS = { open: 'Open', in_progress: 'In Progress', completed: 'Completed', cancelled: 'Cancelled' };
function statusTitle(status) {
  if (status == null) return '';
  if (isCustomStatus(status)) return status;
  const cfg = cfgCache;
  if (cfg && cfg.statusLabels && cfg.statusLabels[status]) return cfg.statusLabels[status];
  return FRIENDLY_STATUS[status] || status;
}
/* is this a "not yet done" status (drives "this week", "next up")? */
function isOpenStatus(status) {
  return coarseOf(status) === 'open';
}
function serviceTypes() {
  if (Overlay.data.types) return Overlay.data.types;
  return baseServiceTypes();
}
/* display title for a service-type token: "oil_change" -> "Oil change" */
function typeTitle(t) {
  if (!t) return '';
  return String(t).split(/[\s_-]+/).filter(Boolean)
    .map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
/* the backend's own service-type list (the "default" the settings
   screen diffs against, independent of any saved overlay) */
function baseServiceTypes() {
  if (cfgCache && Array.isArray(cfgCache.serviceTypes) && cfgCache.serviceTypes.length) return cfgCache.serviceTypes;
  return Overlay.DEFAULT_TYPES;
}
/* label resolver (C24): overlay -> backend config -> built-in default */
function label(key) {
  const o = Overlay.data.labels;
  if (o && o[key]) return o[key];
  if (cfgCache && cfgCache.fieldLabels && cfgCache.fieldLabels[key]) return cfgCache.fieldLabels[key];
  return Overlay.DEFAULT_LABELS[key] || key;
}

/* Status colors. The canonical lifecycle from the spec keeps its
   §4.1 hexes; the backend's own statuses map onto the closest
   canonical color (open→Scheduled blue, in_progress→In Service amber,
   completed→Paid neutral, cancelled→No-Show red); custom statuses take
   the next free swatch from the fixed AA palette. */
const STATUS_LIGHT = {
  Scheduled: ['#2E6E8E', '#E3F0F7'], 'In Service': ['#8A5A00', '#FBEED8'],
  'Awaiting Parts': ['#A6450C', '#F9E7DE'], Ready: ['#2E7D4F', '#E1F2E8'],
  Invoiced: ['#4A5FA5', '#E6EAF5'], Paid: ['#6B6357', '#EFEBE3'], 'No-Show': ['#B3261E', '#F9E4E2'],
  open: ['#2E6E8E', '#E3F0F7'], in_progress: ['#8A5A00', '#FBEED8'],
  completed: ['#6B6357', '#EFEBE3'], cancelled: ['#B3261E', '#F9E4E2'],
};
const STATUS_DARK = {
  Scheduled: '#6EC1E4', 'In Service': '#FFB43C', 'Awaiting Parts': '#FF7A45',
  Ready: '#6FCF97', Invoiced: '#7AA2FF', Paid: '#8D7F70', 'No-Show': '#FF4A2A',
  open: '#6EC1E4', in_progress: '#FFB43C', completed: '#8D7F70', cancelled: '#FF4A2A',
};
function customSwatch(name) {
  const customs = Overlay.data.customs;
  const i = customs.indexOf(name);
  if (i === -1) return null;
  const used = new Set();
  customs.slice(0, i).forEach((s) => {
    if (!s) return;
    const pick = Overlay.SWATCHES.find((sw) => !used.has(sw[0]));
    if (pick) used.add(pick[0]);
  });
  return Overlay.SWATCHES.find((sw) => !used.has(sw[0])) || null;
}
function statusColor(name) {
  const dark = document.documentElement.dataset.host === 'dark';
  if (dark) {
    const custom = customSwatch(name);
    const t = custom ? custom[0] : (STATUS_DARK[name] || '#8D7F70');
    return { text: t, bg: t + '24', border: t + '40' };
  }
  if (STATUS_LIGHT[name]) return { text: STATUS_LIGHT[name][0], bg: STATUS_LIGHT[name][1], border: STATUS_LIGHT[name][0] + '40' };
  const custom = customSwatch(name);
  return custom ? { text: custom[0], bg: custom[1], border: custom[0] + '40' } : { text: '#6B6357', bg: '#EFEBE3', border: '#6B635740' };
}
function chip(status) {
  const c = statusColor(status);
  const style = c.text ? `--c:${c.text};--cbg:${c.bg};--cborder:${c.border};` : '';
  return U.el('span', { class: 'chip num', style }, U.el('span', { class: 'dot', 'aria-hidden': true }), statusTitle(status) || '—');
}

/* ------------------------------ api -------------------------------- */

let api = null;
async function apiReady() {
  if (!api) {
    api = new CrmApi();
    await api.getCustomers(); // lazy load (seeds on first run)
  }
  if (!cfgCache) cfgCache = (await rawConfig()) || null; // re-probe after invalidation
  Overlay.load();
  return api;
}
async function rawConfig() {
  // config is read-only on the backend: probe the live db through a
  // throwaway CrmApi instance over the SAME storage (localStorage).
  // _load() is a mock-private member; acceptable because this bundle
  // owns both halves.
  const probe = new CrmApi();
  await probe.getCustomers();
  return probe._load().config;
}
function config() { return cfgCache; }
function invalidateConfigCache() { cfgCache = null; }

/* ------------------------------ backup ------------------------------ */

/**
 * Export the full customer dataset to a downloadable JSON file.
 *
 * Source of truth: api.getCustomers() — the same localStorage-backed
 * store every screen reads from. No transform, no filter, no delete:
 * every record's fields are serialized exactly as stored. Empty data
 * exports valid JSON with customers: []. No network, no dependencies.
 */
async function backupCustomers() {
  let customers;
  try {
    const a = await apiReady();
    customers = await a.getCustomers(); // no opts -> full dataset
  } catch (e) {
    toast('Backup failed: could not read customer data.', 'error', 'Backup');
    return;
  }
  try {
    const payload = {
      app: 'lease-logic-crm',
      exported_at: new Date().toISOString(),
      record_count: customers.length,
      customers,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const dl = document.createElement('a');
    dl.href = url;
    dl.download = `lease-logic-crm-customers-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.append(dl);
    dl.click();
    dl.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
    toast(`Exported ${customers.length} customer${customers.length === 1 ? '' : 's'}.`, 'success', 'Backup');
  } catch (e) {
    console.warn('llt-crm: backup export failed', e);
    toast('Backup failed: could not create the download.', 'error', 'Backup');
  }
}

/* ------------------------------ nav -------------------------------- */

const nav = {
  dirty: false,
  currentHash: '',
  allowOnce: false,
  suppress: false,
};

function go(hash) {
  if (hash === location.hash) return;
  if (nav.dirty) {
    nav.fromHash = location.hash || '#/dashboard';
    openLeaveDialog(hash);
    return;
  }
  location.hash = hash;
}

function setDirty(v) {
  window.__dirtyLog = window.__dirtyLog || [];
  window.__dirtyLog.push({ v: !!v, t: Date.now(), stack: (new Error().stack || '').split('\n').slice(2, 5).join(' | ').slice(0, 180) });
  nav.dirty = !!v;
  if (v) window.dispatchEvent(new CustomEvent('crm-dirty', { detail: v }));
  else window.dispatchEvent(new CustomEvent('crm-dirty', { detail: v }));
}

function openLeaveDialog(pendingHash) {
  confirmDialog({
    title: 'Unsaved changes',
    body: U.el('span', null, 'Leave and discard your changes?'),
    confirmLabel: 'Discard & leave',
    cancelLabel: 'Stay',
    danger: true,
    focusCancel: true,
    onConfirm() {
      setDirty(false);
      if (pendingHash) go(pendingHash);
      else render();
    },
  });
}

/* ---------------------------- dialogs ------------------------------ */

let dlgFocusPrev = null;
function confirmDialog({ title, body, confirmLabel = 'Confirm', cancelLabel = 'Cancel', danger = false, onConfirm, focusCancel = false }) {
  const host = document.getElementById('dlgHost');
  const focusables = () => Array.from(dlg.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])')).filter((n) => !n.disabled);
  const dlg = U.el('div', { class: 'dialog', role: 'alertdialog', 'aria-modal': 'true', 'aria-label': title });
  dlg.append(
    U.el('div', { class: 'grab', 'aria-hidden': true }),
    U.el('h3', { text: title }),
    U.el('div', { class: 'db' }, body),
    U.el('div', { class: 'bf' },
      U.el('button', {
        class: 'btn secondary', type: 'button', id: 'dlg-cancel',
        onclick: () => close(),
      }, cancelLabel),
      U.el('button', {
        class: `btn ${danger ? 'danger' : 'primary'}`, type: 'button', id: 'dlg-confirm',
        onclick: () => {
          const h = dlg.onConfirm;
          close();
          if (h) h();
        },
      }, confirmLabel),
    ),
  );
  dlg.onConfirm = onConfirm;
  const backdrop = U.el('div', { class: 'backdrop', onclick: (e) => { if (e.target === backdrop) close(); } }, dlg);
  host.append(backdrop);
  document.body.style.overflow = 'hidden';
  dlgFocusPrev = document.activeElement;
  const key = (e) => {
    if (e.key === 'Escape') { e.stopPropagation(); close(); }
    else if (e.key === 'Tab') {
      const f = focusables();
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  };
  backdrop.addEventListener('keydown', key);
  (focusCancel ? dlg.querySelector('#dlg-cancel') : dlg.querySelector('#dlg-confirm')).focus();
  function close() {
    backdrop.removeEventListener('keydown', key);
    backdrop.remove();
    document.body.style.overflow = '';
    if (dlgFocusPrev && dlgFocusPrev.focus) {
      try { dlgFocusPrev.focus(); } catch { /* node gone */ }
    }
  }
  return { close };
}

/* ------------------------------ toasts ----------------------------- */

function toast(message, kind = 'success', title) {
  const host = document.getElementById('toastHost');
  host.innerHTML = '';
  const t = U.el('div', { class: `toast ${kind}`, role: 'status' },
    title ? U.el('div', { class: 'tt', text: title }) : null,
    U.el('div', { text: message }));
  host.append(t);
  clearTimeout(t._t1);
  clearTimeout(t._t2);
  t._t1 = setTimeout(() => {
    t.classList.add('out');
    t._t2 = setTimeout(() => t.remove(), 220);
  }, 4000);
}

async function withLoad(container, loader) {
  container.innerHTML = '';
  container.append(skeletonBlocks());
  try {
    const data = await loader();
    // NOTE: do not clear the container here — the loader may have
    // already rendered into it (synchronous paints inside the async fn).
    return data;
  } catch (e) {
    container.innerHTML = '';
    container.append(loadError(e));
    return null;

function loadError(e) {

    U.el('div', { style: 'text-align:center;' },
      U.el('div', { class: 'bt', text: "Couldn't load this screen." }),

/* --------------------------- form helpers -------------------------- */

/* A form kit: field registry, dirty tracking, validation flow. */
class FormKit {
  constructor(opts) {
    this.opts = opts; // { onSubmit(values), submitLabel, dirtyable }
    this.fields = new Map(); // name -> {node, input, validate, value, setErr, clearErr, labelEl}
    this.snapshot = null;
    this.root = U.el('div', { class: `form-col ${opts.wide ? 'wide' : ''} ${opts.extraClass || ''}` });
    // The save button renders OUTSIDE the <form> (in the footer row), so a
    // native type=submit button would be inert — associate it via the
    // `form` attribute (needs a form id).
    this.formId = `form-${(FormKit._seq = (FormKit._seq || 0) + 1)}`;
    this.saveBtn = U.el('button', { class: 'btn primary', type: 'submit', disabled: false, form: this.formId }, opts.submitLabel);
    this.foot = U.el('div', { class: 'formfoot' },
      opts.dangerExtra || null,
      U.el('span', { class: 'sp' }),
      U.el('button', {
        class: 'btn ghost', type: 'button',
        onclick: () => go(opts.cancelHref || '#/customers'),
      }, 'Cancel'),
      this.saveBtn,
    );
    this.errBanner = U.el('div', { class: 'banner inline', style: 'display:none;' });
    this.form = U.el('form', { id: this.formId, novalidate: true, onsubmit: (e) => { e.preventDefault(); this.submit(); } },
      this.errBanner,
    );
    this.root.append(this.form, this.foot);
  }

  field(f) {
    this.fields.set(f.name, f);
    if (f.input) {
      f.input.addEventListener('input', () => this.touch());
      f.input.addEventListener('blur', () => {
        if (f.touched !== true) {
          f.touched = true;
          f.validate(f.value());
        }
      });
    }
    return f;
  }

  makeField({ name, lbl, required, hint, type = 'text', placeholder, mono, maxlength, inputmode, attrs = {}, extra, validate }) {
    const errEl = U.el('div', { class: 'errmsg', role: 'alert', style: 'display:none;' });
    const inp = U.el('input', {
      class: `inp ${mono ? 'mono' : ''}`, type, name,
      placeholder, maxlength: maxlength ? String(maxlength) : false,
      inputmode: inputmode || false,
      'aria-required': required ? 'true' : false,
      ...attrs,
    });
    const lab = U.el('label', { for: `f-${name}` }, lbl, required ? U.el('span', { class: 'req', 'aria-hidden': true, text: ' *' }) : null);
    inp.id = `f-${name}`;
    const wrap = U.el('div', { class: 'field', 'data-field': name },
      U.el('div', { class: 'lr' }, lab, extra || null),
      inp,
      hint ? U.el('div', { class: 'hint', text: hint }) : null,
      errEl,
    );
    const field = {
      name, input: inp, labelEl: lab, errEl,
      // Reads from `this.input` live: screens may replace the input node
      // (hidden input -> real select / textarea) after makeField returns,
      // and this.field() keeps `field.input` pointing at the replacement.
      value() { return this.input.value; },
      setErr(msg) {
        const el = this.input; // live: screens may swap in a select/textarea
        if (msg) {
          errEl.textContent = msg;
          errEl.style.display = '';
          el.classList.add('invalid');
          el.setAttribute('aria-invalid', 'true');
          el.setAttribute('aria-describedby', `err-${name}`);
          errEl.id = `err-${name}`;
        } else {
          errEl.style.display = 'none';
          errEl.textContent = '';
          el.classList.remove('invalid');
          el.removeAttribute('aria-invalid');
          el.removeAttribute('aria-describedby');
        }
      },
      clearErr() { this.setErr(null); },
      // Per-field validator supplied by the screen (design spec §7).
      // Paints the result on every call so first-blur AND submit both
      // produce inline errors; returns the message (null = valid).
      validate(v) {
        const msg = validate ? validate(v) : null;
        this.setErr(msg);
        return msg;
      },
    };
    this.form.append(wrap);
    this.field(field);
    return field;
  }

  snapshotNow() {
    this.snapshot = Object.fromEntries([...this.fields.values()].map((f) => [f.name, f.value()]));
    setDirty(false);
  }

  isDirty() {
    if (!this.snapshot) return false;
    return [...this.fields.values()].some((f) => f.value() !== this.snapshot[f.name]);
  }

  touch() {
    setDirty(this.isDirty());
  }

  validateAll() {
    let first = null, count = 0;
    for (const f of this.fields.values()) {
      const msg = f.validate(f.value());
      f.setErr(msg);
      if (msg) {
        count++;
        if (!first) first = f;
      }
    }
    return { first, count };
  }

  setApiErrors(errors) {
    let count = 0;
    for (const [k, v] of Object.entries(errors || {})) {
      if (k.startsWith('_')) continue;
      const f = this.fields.get(k);
      if (f) {
        f.setErr(String(v));
        count++;
      }
    }
    return count;
  }

  announceErrors(count) {
    if (!count) return;
    const a = U.el('div', { class: 'errmsg', role: 'alert', style: 'margin-bottom:12px;' }, `${count} field${count > 1 ? 's' : ''} need${count > 1 ? '' : 's'} attention`);
    this.form.prepend(a);
    setTimeout(() => a.remove(), 6000);
  }

  async submit() {
    this.errBanner.style.display = 'none';
    const { first, count } = this.validateAll();
    if (count) {
      this.announceErrors(count);
      first.input.scrollIntoView({ block: 'center' });
      first.input.focus();
      return;
    }
    const values = Object.fromEntries([...this.fields.values()].map((f) => [f.name, f.value()]));
    this.saveBtn.disabled = true;
    this.saveBtn.innerHTML = '';
    this.saveBtn.append(U.el('span', { class: 'spinner', 'aria-hidden': true }), document.createTextNode(this.opts.submitLabel));
    const t0 = Date.now();
    try {
      const result = await this.opts.onSubmit(values);
      const wait = Math.max(0, 200 - (Date.now() - t0));
      setTimeout(() => {
        setDirty(false);
        if (result && result.toast) toast(result.toast);
        if (result && result.go) go(result.go);
      }, wait);
    } catch (e) {
      this.saveBtn.disabled = false;
      this.saveBtn.innerHTML = '';
      this.saveBtn.textContent = this.opts.submitLabel;
      if (e instanceof ApiError && e.code === 'validation') {
        const n = this.setApiErrors(e.errors);
        if (n) {
          // Do NOT re-run validateAll() here: the API can reject input the
          // client validators passed (server-side rules — referential
          // checks, unknown status), so re-validating would call
          // setErr(null) on those fields and wipe the API errors we just
          // painted. Focus the first flagged field.
          const firstInvalid = this.form.querySelector('.invalid');
          if (firstInvalid) firstInvalid.focus();
          return;
        }
      }
      this.errBanner.innerHTML = '';
      this.errBanner.append(
        U.el('span', { class: 'bt', text: "Couldn't save." }),
        U.el('span', { class: 'bd', text: `${e && e.message ? e.message : 'Unknown error.'} Your input is kept — try again.` }),
      );
      this.errBanner.style.display = '';
    }
  }
}

/* number/currency field helpers */
function parseMoney(s) {
  if (s === '' || s == null) return null;
  const n = Number(String(s).replace(/[$,\s]/g, ''));
  return Number.isFinite(n) ? n : NaN;
}
function sanitizeMoneyInput(inp) {
  const n = parseMoney(inp.value);
  if (n === null) { inp.value = ''; return; }
  if (!Number.isFinite(n) || n < 0) { inp.value = ''; return; }
  inp.value = String(Math.min(999999.99, n));
}
function parseNumStr(s) {
  if (s === '' || s == null) return null;
  const n = parseInt(String(s).replace(/[^\d]/g, ''), 10);
  return Number.isFinite(n) ? n : NaN;
}

function counterEl({ showAt, max }) {
  const c = U.el('span', { class: 'counter', style: 'display:none;', 'aria-live': 'polite' });
  return {
    node: c,
    bind(inp) {
      const upd = () => {
        const len = inp.value.length;
        if (len >= showAt || (max && len > max)) {
          c.style.display = '';
          c.textContent = `${len.toLocaleString('en-US')} / ${max.toLocaleString('en-US')}`;
          c.classList.toggle('warn', len > max);
        } else c.style.display = 'none';
      };
      inp.addEventListener('input', upd);
      upd();
    },
  };
}

/* roving tabindex for clickable table rows */
function rovingRows(container, activate) {
  const rows = () => Array.from(container.querySelectorAll('tr.rowlink'));
  const sync = () => {
    const r = rows();
    r.forEach((row, i) => row.setAttribute('tabindex', i === 0 ? '0' : '-1'));
  };
  container.addEventListener('keydown', (e) => {
    const r = rows();
    const i = r.indexOf(document.activeElement);
    if (i === -1) return;
    let j = -1;
    if (e.key === 'ArrowDown') j = Math.min(r.length - 1, i + 1);
    else if (e.key === 'ArrowUp') j = Math.max(0, i - 1);
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = r.length - 1;
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(r[i].dataset.id); return; }
    else return;
    e.preventDefault();
    r[i].setAttribute('tabindex', '-1');
    r[j].setAttribute('tabindex', '0');
    r[j].focus();
  });
  sync();
  return { sync };
}

/* ------------------------------ router ----------------------------- */

const screens = {};
function registerScreen(name, fn) { screens[name] = fn; }

const ROUTES = [
  { re: /^#\/$/, go: (ctx) => go('#/dashboard') },
  { re: /^#\/dashboard$/, screen: 'dashboard' },
  { re: /^#\/customers$/, screen: 'customers' },
  { re: /^#\/customers\/new$/, screen: 'customerForm' },
  { re: /^#\/customers\/(c\d+)$/, screen: 'customerDetail' },
  { re: /^#\/customers\/(c\d+)\/edit$/, screen: 'customerForm' },
  { re: /^#\/customers\/(c\d+)\/vehicles\/new$/, go: (ctx) => go(`#/vehicles/new?customer=${ctx.m[1]}`) },
  { re: /^#\/vehicles\/(v\d+)$/, screen: 'vehicleForm' },
  { re: /^#\/vehicles\/new$/, screen: 'vehicleForm' },
  { re: /^#\/jobs\/new$/, screen: 'jobForm' },
  { re: /^#\/jobs\/(j\d+)$/, screen: 'jobForm' },
  { re: /^#\/settings$/, screen: 'settings' },
];

function parseRoute() {
  const h = location.hash || '#/';
  const qi = h.indexOf('?');
  const path = qi === -1 ? h : h.slice(0, qi);
  const query = new URLSearchParams(qi === -1 ? '' : h.slice(qi + 1));
  return { path, query, hash: h };
}

function render() {
  window.__routeLog = window.__routeLog || [];
  window.__routeLog.push({ hash: location.hash, dirty: nav.dirty, t: Date.now() });
  setDirty(false);
  nav.currentHash = location.hash;
  const view = document.getElementById('view');
  if (!view) return;
  setActiveNav();
  closeQa();
  const { path, query } = parseRoute();
  for (const r of ROUTES) {
    const m = path.match(r.re);
    if (!m) continue;
    if (r.go) { r.go({ query, m }); return; }
    view.innerHTML = '';
    document.getElementById('main').scrollTo?.(0, 0);
    window.scrollTo(0, 0);
    document.getElementById('crmMount').scrollTop = 0;
    screens[r.screen](view, { id: m[1] || null, query });
    return;
  }
  // unmatched
  view.innerHTML = '';
  view.append(notFoundScreen(`No screen at “${path}”.`));
}

window.addEventListener('hashchange', () => {
  if (nav.suppress) { nav.suppress = false; return; }
  if (nav.dirty) {
    if (nav.allowOnce) {
      nav.allowOnce = false;
      render();
      return;
    }
    // Dirty form bypassed via back/forward or a manual hash edit:
    // restore the form's route, then offer the leave dialog.
    const from = nav.currentHash || location.hash;
    if (from !== location.hash) {
      nav.suppress = true;
      location.hash = from; // fires another hashchange; suppressed
      if (from === location.hash) nav.suppress = false;
    }
    openLeaveDialog(null);
    return;
  }
  render();
});

window.addEventListener('beforeunload', (e) => {
  if (nav.dirty) { e.preventDefault(); e.returnValue = ''; }
});

/* ------------------------------ boot ------------------------------- */

async function boot() { if (window.__crmBooted) return; window.__crmBooted = true;
  const root = U.el('div', { id: 'crm-root' });
  document.getElementById('crmMount').append(root);
  const nameSpan = U.el('span', { id: 'crmShopName', style: 'display:none;', text: 'Loading…' });
  document.getElementById('crmMount').append(nameSpan);
  buildShell(root);

  const dark = document.documentElement.getAttribute('data-host') === 'dark' || document.body.getAttribute('data-host') === 'dark';
  if (dark) document.documentElement.setAttribute('data-host', 'dark');

  try {
    await apiReady();
    const cfg = await config();
    setShopName(cfg.shopName || 'Shop CRM');
    Overlay.load();
  } catch (e) {
    root.innerHTML = '';
    root.append(loadError(e));
    return;
  }

  if (!location.hash) {
    nav.suppress = false;
    location.hash = '#/dashboard';
  } else {
    render();
  }
}

'use strict';

/* ------------------------- shared lookups -------------------------- */

/* one pass: everything a list row needs, keyed by id */
async function listData() {
  const [customers, vehicles, jobs] = await Promise.all([
    api.getCustomers(),
    api.getVehicles(),
    api.getJobs({ dir: 'date_desc' }),
  ]);
  const vehByCust = {}, jobsByCust = {}, jobsByVeh = {}, custById = {}, vehById = {};
  customers.forEach((c) => { custById[c.id] = c; vehByCust[c.id] = []; jobsByCust[c.id] = []; });
  vehicles.forEach((v) => { vehById[v.id] = v; (vehByCust[v.customerId] || (vehByCust[v.customerId] = [])).push(v); });
  jobs.forEach((j) => {
    (jobsByCust[j.customerId] || (jobsByCust[j.customerId] = [])).unshift(j); // date_desc in
    (jobsByVeh[j.vehicleId] || (jobsByVeh[j.vehicleId] = [])).unshift(j);
  });
  return { customers, vehicles, jobs, custById, vehById, vehByCust, jobsByCust, jobsByVeh };
}
